<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Banana Crush: fling a realistic banana peel into the air and get scored on how close it lands to the perfect splayed peel.">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>Banana Crush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --wall:#26307A; --wall-deep:#171E55; --cream:#FBF4E2; --cream-2:#F1E7CC;
    --ink:#1B1E2E; --muted:#6A6780; --yellow:#F7C62F; --yellow-deep:#D99A1C;
    --tomato:#E8573B; --tomato-deep:#C4402A; --sage:#CFDCC8; --line:rgba(27,30,46,.12);
    --display:"Rammetto One", "Arial Black", system-ui, sans-serif;
    --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: light;
  }
  [hidden]{display:none!important}
  html,body{height:100%}
  body{background:var(--wall-deep);color:var(--ink);font-family:var(--body);font-size:15px;
    padding-inline:16px;padding-block:16px;box-sizing:border-box}
  *,*::before,*::after{box-sizing:border-box}
  .app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;height:100%;max-width:1440px;margin:0 auto}
  .stage{position:relative;border-radius:20px;overflow:hidden;min-height:440px;background:var(--wall);
    box-shadow:0 0 0 1px rgba(255,255,255,.06) inset}
  .stage{background:linear-gradient(180deg,#141A52 0%,#2A3486 38%,#6B73B3 62%,#6B73B3 100%)}
  #gl,#game{position:absolute;inset:0;display:block;width:100%;height:100%}
  #game{touch-action:none;cursor:grab;outline:none}
  .glfail{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--cream);padding:14px 18px;border-radius:12px;margin:0;max-width:80%}
  #game:focus-visible{box-shadow:0 0 0 3px var(--yellow) inset}
  #game.grabbing{cursor:grabbing}

  .hud{position:absolute;left:20px;top:18px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;pointer-events:none;max-width:min(420px,60%)}
  .hud h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,40px);line-height:1;color:var(--yellow);
    letter-spacing:.01em;text-shadow:0 3px 0 var(--wall-deep)}
  .hint{margin:0;background:rgba(15,19,60,.55);color:var(--cream);padding:8px 12px;border-radius:10px;font-weight:500;line-height:1.35;
    backdrop-filter:blur(4px)}
  .hint.warn{background:var(--tomato);color:#fff}
  .btn{font:600 14px/1 var(--body);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;pointer-events:auto;transition:transform .12s, background .12s}
  .btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--tomato);color:#fff;box-shadow:0 3px 0 var(--tomato-deep)}
  .btn.primary:hover{background:#F0674B}
  .btn.ghost{background:rgba(15,19,60,.62);color:var(--cream);box-shadow:inset 0 0 0 1px rgba(251,244,226,.35);backdrop-filter:blur(4px)}
  .btn.ghost:hover{background:rgba(15,19,60,.8)}

  .ref{position:absolute;right:16px;top:16px;margin:0;background:var(--cream);border-radius:16px;padding:10px 12px 12px;
    display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.18);pointer-events:none;transition:opacity .3s}
  .stage.comparing .ref{opacity:0}
  #ref{width:132px;height:112px;display:block}
  .ref figcaption{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.25}
  .ref b{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.02em}
  .ref span{font-size:11.5px;color:var(--muted);max-width:140px}

  .result{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:min(330px,calc(100% - 32px));background:var(--cream);
    border-radius:18px;padding:18px 18px 16px;box-shadow:0 10px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;gap:12px;
    animation:slideIn .45s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes slideIn{from{opacity:0;transform:translate(40px,-50%)}to{opacity:1;transform:translate(0,-50%)}}
  .res-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .score{font-family:var(--display);font-size:54px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
  .score small{font-family:var(--body);font-size:16px;font-weight:600;color:var(--muted);margin-left:4px}
  .stamp{font-family:var(--display);font-size:34px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
    color:var(--tomato);border:3px solid var(--tomato);transform:rotate(-12deg) scale(0);opacity:0;flex:none}
  .stamp.on{animation:stamp .5s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes stamp{to{transform:rotate(-12deg) scale(1);opacity:1}}
  .verdict{margin:0;font-weight:600;font-size:16px}
  .metrics{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .metrics li{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
  .metrics .m-label{font-weight:600;font-size:13.5px}
  .metrics .m-label i{font-style:normal;font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
  .metrics .m-pts{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .bar{grid-column:1/-1;height:8px;border-radius:6px;background:var(--cream-2);overflow:hidden}
  .bar span{display:block;height:100%;width:0;background:var(--yellow-deep);border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.3,1)}
  .res-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .saved{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}

  .side{display:flex;flex-direction:column;gap:16px;min-height:0}
  .card{background:var(--cream);border-radius:18px;padding:16px}
  .player{display:flex;flex-direction:column;gap:10px}
  #player-name{font:600 18px var(--body);color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
  #player-name:focus{outline:none;border-color:var(--yellow-deep)}
  .idrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .idchip{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--ink);color:var(--yellow);padding:5px 9px;border-radius:8px;letter-spacing:.04em}
  .mystats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--line);padding-top:10px}
  .mystats div{display:flex;flex-direction:column;gap:2px}
  .mystats b{font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
  .mystats span{font-size:12px;color:var(--muted)}

  .board{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
  .board-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .board-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:19px}
  .tabs{display:flex;background:var(--cream-2);border-radius:999px;padding:3px}
  .tabs button{font:600 12.5px var(--body);border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--cream)}
  .tabs button:focus-visible{outline:2px solid var(--yellow-deep)}
  #board-list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:120px;display:flex;flex-direction:column}
  .row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row.me{background:rgba(247,198,47,.22);border-radius:10px}
  .rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--mono);background:var(--cream-2);color:var(--ink)}
  .rank.r1{background:#F2B705}.rank.r2{background:#C9CBD6}.rank.r3{background:#D99466}
  .who{display:flex;flex-direction:column;min-width:0;gap:2px}
  .who .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .sub{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
  .who .pid{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--cream-2);padding:1px 5px;border-radius:5px}
  .you{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tomato)}
  .pts{display:flex;align-items:baseline;gap:6px}
  .pts b{font-family:var(--display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
  .pts .g{font:700 11px var(--mono);color:var(--tomato)}
  .empty{color:var(--muted);padding:18px 4px;line-height:1.45}
  .note{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}
  .note:empty{display:none}

  @media (max-width:880px){
    body{height:auto}
    html{height:auto}
    .app{grid-template-columns:1fr;height:auto}
    .stage{height:68vh;min-height:460px}
    .board{min-height:360px}
    #board-list{max-height:420px}
  }
  @media (max-width:560px){
    .hud{max-width:calc(100% - 150px)}
    .hint{font-size:13px}
    #ref{width:96px;height:80px}
    .ref span{display:none}
    .result{top:auto;bottom:12px;right:12px;left:12px;width:auto;transform:none;padding:14px;gap:9px;animation:slideUp .45s cubic-bezier(.2,.9,.3,1.2)}
    @keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
    .score{font-size:42px}
    .metrics{gap:6px}
  }
  @media (prefers-reduced-motion:reduce){
    .result,.stamp.on{animation-duration:.01s}
    .bar span{transition-duration:.01s}
  }
</style>

</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="game" tabindex="0" aria-label="Throwing area. Drag the banana peel and release to throw it. Press Space for an automatic toss."></canvas>
    <p class="glfail" id="glfail" hidden>This game needs WebGL, which isn't available in this browser.</p>
    <div class="hud">
      <h1>Banana Crush</h1>
      <p class="hint" id="hint">Drag the peel and fling it up. Let go to throw.</p>
      <button class="btn ghost" id="auto" type="button">Toss for me</button>
    </div>
    <figure class="ref">
      <canvas id="ref"></canvas>
      <figcaption><b>The perfect peel</b><span>4 flaps, 90° apart, skin side up, resting still</span></figcaption>
    </figure>
    <div class="result" id="result" hidden>
      <div class="res-head">
        <div>
          <div class="eyebrow">Your throw vs the perfect peel</div>
          <div class="score"><span id="res-score">0</span><small>/ 100</small></div>
        </div>
        <div class="stamp" id="res-grade">A</div>
      </div>
      <p class="verdict" id="res-verdict"></p>
      <ul class="metrics" id="res-metrics"></ul>
      <div class="res-actions"><button class="btn primary" id="again" type="button">Throw again</button></div>
      <p class="saved" id="res-saved"></p>
    </div>
  </main>

  <aside class="side">
    <section class="card player">
      <label class="eyebrow" for="player-name">Thrower</label>
      <input id="player-name" maxlength="20" placeholder="Your name" autocomplete="nickname" spellcheck="false">
      <div class="idrow"><span class="eyebrow">Player ID</span><code class="idchip" id="player-id">BN-····</code></div>
      <div class="mystats">
        <div><b id="my-throws">0</b><span>throws</span></div>
        <div><b id="my-best">–</b><span>best score</span></div>
        <div><b id="my-rank">–</b><span>best rank</span></div>
      </div>
    </section>
    <section class="card board">
      <div class="board-head">
        <h2>Leaderboard</h2>
        <div class="tabs" role="tablist" aria-label="Leaderboard view">
          <button id="tab-top" role="tab" aria-selected="true" type="button">Top</button>
          <button id="tab-recent" role="tab" aria-selected="false" type="button">Recent</button>
        </div>
      </div>
      <ol id="board-list"><li class="empty">Loading leaderboard…</li></ol>
      <p class="note" id="board-note"></p>
    </section>
  </aside>
</div>

<script>
(() => {
"use strict";
/* ---------- vector helpers ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l,a[2]/l];};
const avg=pts=>{let x=0,y=0,z=0;for(const p of pts){x+=p[0];y+=p[1];z+=p[2];}const n=pts.length;return [x/n,y/n,z/n];};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const rand=(a,b)=>a+Math.random()*(b-a);
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- peel geometry ----------
   Modelled on a real peel: the thin neck (stalk end) is the only part that
   holds the four long, curved flaps together. */
const N=12, L=1.35, RC=0.075, NECK_H=0.36, HALF=0.7, GR=0.01, GRAV=-18, THICK=0.024, ARC_R=3;

const topo=(()=>{
  let idx=0; const ring=[], neck=[], flaps=[];
  for(let j=0;j<12;j++) ring.push(idx++);
  for(let j=0;j<4;j++) neck.push(idx++);
  const nubB=idx++, nubT=idx++;
  for(let i=0;i<4;i++){
    const rows=[[ring[3*i],ring[3*i+1],ring[3*i+2]]];
    for(let k=1;k<=N;k++) rows.push([idx++,idx++,idx++]);
    flaps.push(rows);
  }
  return {count:idx, ring, neck, nubB, nubT, flaps, core:[...ring,...neck,nubB,nubT]};
})();

const W0=2*RC*Math.sin(HALF);
function widthAt(u){
  const grow=u<0.28?W0+(0.34-W0)*Math.sin(u/0.28*Math.PI/2):0.34;
  const taper=u>0.62?Math.sqrt(Math.max(0,1-Math.pow((u-0.62)/0.38,2))):1;
  return grow*(0.2+0.8*taper);
}
function sagAt(u){ const w=widthAt(u); return (ARC_R-Math.sqrt(ARC_R*ARC_R-w*w/4))*(1-0.35*u); }

/* a = splay of each flap: 0 hangs straight down, PI/2 lies flat */
function posePositions(a, origin=[0,0,0], yaw=0){
  const out=new Array(topo.count), cy=Math.cos(yaw), sy=Math.sin(yaw);
  const place=(i,l)=>{out[i]=[origin[0]+l[0]*cy-l[2]*sy, origin[1]+l[1], origin[2]+l[0]*sy+l[2]*cy];};
  for(let i=0;i<4;i++){
    const th=i*Math.PI/2;
    [-HALF,0,HALF].forEach((d,c)=>place(topo.ring[3*i+c],[RC*Math.cos(th+d),0,RC*Math.sin(th+d)]));
    place(topo.neck[i],[0.05*Math.cos(th+Math.PI/4),0.18,0.05*Math.sin(th+Math.PI/4)]);
  }
  place(topo.nubB,[0,0.3,0]);
  place(topo.nubT,[0,NECK_H,0]);
  for(let i=0;i<4;i++){
    const th=i*Math.PI/2, ai=Array.isArray(a)?a[i]:a;
    const o=[Math.cos(th),0,Math.sin(th)], lat=[-Math.sin(th),0,Math.cos(th)];
    const mid0=mul(o,RC*Math.cos(HALF));
    const dir=add(mul(o,Math.sin(ai)),[0,-Math.cos(ai),0]);
    const nf=add(mul(o,Math.cos(ai)),[0,Math.sin(ai),0]);
    for(let k=1;k<=N;k++){
      const u=k/N, m=add(mid0,mul(dir,u*L)), w=widthAt(u);
      place(topo.flaps[i][k][0],sub(m,mul(lat,w/2)));
      place(topo.flaps[i][k][1],add(m,mul(nf,sagAt(u))));
      place(topo.flaps[i][k][2],add(m,mul(lat,w/2)));
    }
  }
  return out;
}

/* ---------- physics: Verlet particles + distance constraints ---------- */
const C=[];
(function buildConstraints(){
  const s=posePositions(Math.PI/2), h=s;
  const link=(a,b,k,src=s)=>C.push({a,b,r:len(sub(src[a],src[b])),k});
  const core=topo.core;
  for(let i=0;i<core.length;i++) for(let j=i+1;j<core.length;j++) link(core[i],core[j],1);
  topo.flaps.forEach(rows=>{
    for(let k=0;k<N;k++){
      for(let c=0;c<3;c++) link(rows[k][c],rows[k+1][c],1);
      for(let c=0;c<2;c++){ link(rows[k][c],rows[k+1][c+1],0.7); link(rows[k][c+1],rows[k+1][c],0.7); }
    }
    for(let k=1;k<=N;k++){ link(rows[k][0],rows[k][1],1); link(rows[k][1],rows[k][2],1); link(rows[k][0],rows[k][2],0.35); }
    for(let k=0;k<N-1;k++) for(let c=0;c<3;c++) link(rows[k][c],rows[k+2][c],0.35);
    for(let c=0;c<3;c++){ link(topo.nubB,rows[1][c],0.045,h); link(topo.nubB,rows[2][c],0.03,h); }
  });
})();

let P=[], Q=[], Wt=[], coreLocal=[], pinned=true;
const kin={c:[0,0,0], prevC:[0,0,0], target:[0,0,0], tilt:0, prevTilt:0, tiltRate:0};
let extraDamp=1;

const HOME=[0,1.75,0];
function resetPeel(){
  // held by the stalk in the air; the flaps hang freely under gravity
  const pos=posePositions(0.12);
  const cc=avg(topo.core.map(i=>pos[i]));
  P=pos.map(p=>add(sub(p,cc),HOME)); Q=P.map(p=>p.slice());
  Wt=new Array(topo.count).fill(1);
  extraDamp=1;
  pinCore();
  // let the flaps settle into their natural hang before the first frame
  for(let n=0;n<360;n++){ step(H_STEP); for(let i=0;i<P.length;i++){ const p=P[i],q=Q[i]; q[0]=lerp(q[0],p[0],0.08); q[1]=lerp(q[1],p[1],0.08); q[2]=lerp(q[2],p[2],0.08); } }
  for(let i=0;i<P.length;i++) Q[i]=P[i].slice();
}
function pinCore(){
  const c=avg(topo.core.map(i=>P[i]));
  coreLocal=topo.core.map(i=>sub(P[i],c));
  topo.core.forEach(i=>Wt[i]=0);
  pinned=true;
  Object.assign(kin,{c:c.slice(),prevC:c.slice(),target:c.slice(),tilt:0,prevTilt:0,tiltRate:0});
}
function unpinCore(){ topo.core.forEach(i=>Wt[i]=0.8); pinned=false; }
const coreCentroid=()=>avg(topo.core.map(i=>P[i]));

function step(h){
  const g=GRAV*h*h, dragFlap=(1-0.45*h)*extraDamp, dragCore=(1-0.2*h)*extraDamp;
  for(let i=0;i<P.length;i++){
    if(Wt[i]===0) continue;
    const p=P[i], q=Q[i], damp=i<18?dragCore:dragFlap;
    const vx=(p[0]-q[0])*damp, vy=(p[1]-q[1])*damp, vz=(p[2]-q[2])*damp;
    q[0]=p[0]; q[1]=p[1]; q[2]=p[2];
    p[0]+=vx; p[1]+=vy+g; p[2]+=vz;
  }
  if(pinned){
    kin.prevC=kin.c.slice();
    kin.c=[lerp(kin.c[0],kin.target[0],0.35),lerp(kin.c[1],kin.target[1],0.35),lerp(kin.c[2],kin.target[2],0.35)];
    const vx=(kin.c[0]-kin.prevC[0])/h;
    kin.prevTilt=kin.tilt;
    kin.tilt+=(clamp(-vx*0.06,-0.9,0.9)-kin.tilt)*0.08;
    kin.tiltRate=(kin.tilt-kin.prevTilt)/h;
    const c=Math.cos(kin.tilt), s=Math.sin(kin.tilt);
    topo.core.forEach((i,j)=>{
      const l=coreLocal[j];
      Q[i]=P[i].slice();
      P[i]=add(kin.c,[l[0]*c-l[1]*s,l[0]*s+l[1]*c,l[2]]);
    });
  }
  for(let i=0;i<P.length;i++){
    const p=P[i], q=Q[i];
    if(p[1]<GR){
      // soft, energy-absorbing contact: no rebound, strong friction (peel skin is moist and grippy)
      const vx=p[0]-q[0], vz=p[2]-q[2];
      p[1]=GR; q[1]=GR;
      if(Math.hypot(vx,vz)/h<0.35){ q[0]=p[0]; q[2]=p[2]; }
      else { q[0]=p[0]-vx*0.3; q[2]=p[2]-vz*0.3; }
    }
    if(p[0]>34){p[0]=34;q[0]=34;} if(p[0]<-34){p[0]=-34;q[0]=-34;}
    if(p[2]>6){p[2]=6;q[2]=6;} if(p[2]<-20){p[2]=-20;q[2]=-20;}
  }
  for(let it=0;it<12;it++){
    for(const c of C){
      const pa=P[c.a], pb=P[c.b], wa=Wt[c.a], wb=Wt[c.b], ws=wa+wb;
      if(ws===0) continue;
      const dx=pb[0]-pa[0], dy=pb[1]-pa[1], dz=pb[2]-pa[2];
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1e-6;
      const f=(d-c.r)/d*c.k/ws;
      pa[0]+=dx*f*wa; pa[1]+=dy*f*wa; pa[2]+=dz*f*wa;
      pb[0]-=dx*f*wb; pb[1]-=dy*f*wb; pb[2]-=dz*f*wb;
    }
    for(const p of P) if(p[1]<GR) p[1]=GR;
  }
  // anything resting on the floor keeps no upward velocity from constraint pushes: no hopping
  if(!pinned) for(let i=0;i<P.length;i++){ const p=P[i], q=Q[i]; if(p[1]<GR+0.004&&p[1]>q[1]) q[1]=p[1]; }
}

const H_STEP=1/120;
function release(vel, spinBoost=1){
  const c=coreCentroid(), speed=len(vel);
  const w=[rand(-1,1)*(0.4+speed*0.09)*spinBoost, rand(-1.5,1.5), clamp(kin.tiltRate*0.8,-6,6)+rand(-1,1)*speed*0.04*spinBoost];
  const v0=add(vel,[0,0,rand(-0.5,0.5)]);
  for(let i=0;i<P.length;i++){
    const own=sub(P[i],Q[i]);
    const r=sub(P[i],c), v=add(v0,cross(w,r));
    Q[i]=sub(P[i],add(mul(v,H_STEP),mul(own,0.3)));
  }
  topo.core.forEach(i=>{ Wt[i]=0.8; });
  pinned=false;
}

/* ---------- procedural textures ---------- */
function noiseFill(g,w,h,amt){
  const img=g.getImageData(0,0,w,h), d=img.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-0.5)*amt; d[i]+=n; d[i+1]+=n; d[i+2]+=n*0.7; }
  g.putImageData(img,0,0);
}
function wobbleLine(g,x0,y,len,amp){
  g.beginPath(); g.moveTo(x0,y);
  const segs=Math.max(2,Math.round(len/60));
  for(let i=1;i<=segs;i++) g.lineTo(x0+len*i/segs, y+rand(-amp,amp));
  g.stroke();
}
function spot(g,x,y,r,a){
  const halo=g.createRadialGradient(x,y,0,x,y,r*2.6);
  halo.addColorStop(0,`rgba(110,70,20,${0.3*a})`); halo.addColorStop(1,"rgba(110,70,20,0)");
  g.fillStyle=halo; g.beginPath(); g.ellipse(x,y,r*2.6*1.5,r*2.6,0,0,Math.PI*2); g.fill();
  g.fillStyle=`rgba(${rand(60,90)|0},${rand(36,52)|0},${rand(12,22)|0},${a})`;
  g.beginPath(); g.ellipse(x,y,r*rand(1.2,2.2),r,rand(-0.2,0.2),0,Math.PI*2); g.fill();
}

function brownEdges(g,w,h,bands,inner){
  const bh=h/bands;
  for(let b=0;b<bands;b++){
    for(const top of [true,false]){
      const y0=top?b*bh:(b+1)*bh, dir=top?1:-1;
      const gr=g.createLinearGradient(0,y0,0,y0+dir*bh*0.13);
      gr.addColorStop(0,inner?"rgba(120,82,34,0.7)":"rgba(70,40,14,0.95)");
      gr.addColorStop(0.25,inner?"rgba(150,110,50,0.35)":"rgba(110,70,22,0.5)");
      gr.addColorStop(1,"rgba(110,70,22,0)");
      g.fillStyle=gr; g.fillRect(0,top?y0:y0-bh*0.13,w,bh*0.13);
      // ragged torn edge
      g.strokeStyle=inner?"rgba(110,76,34,0.55)":"rgba(58,33,12,0.85)";
      for(let x=0;x<w;){
        const seg=rand(40,160); g.lineWidth=rand(2,6);
        g.beginPath(); g.moveTo(x,y0+dir*rand(1,5)); g.lineTo(x+seg,y0+dir*rand(1,7)); g.stroke(); x+=seg*0.8;
      }
    }

  const sorted=phis.slice().sort((a,b)=>a-b);
  let err=0; for(let i=0;i<4;i++){ const gp=i<3?sorted[i+1]-sorted[i]:sorted[0]+Math.PI*2-sorted[3]; err+=Math.abs(gp-Math.PI/2); }
  const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
  const m={
    even:Math.pow(clamp(1-err/(0.55*Math.PI),0,1),1.6),
    face:mean(faces),
    reach:Math.pow(mean(reaches),2),
    upright:Math.pow(clamp(axis[1],0,1),4),
    flat:mean(flats),
  };
  const pts={}; let raw=0;
  METRICS.forEach(([k,,,w])=>{pts[k]=m[k]*w; raw+=m[k]*w;});
  const score=Math.round(100*Math.pow(clamp(raw/100,0,1),1.5));
  let sx=0,sy=0; phis.forEach(p=>{sx+=Math.cos(4*p);sy+=Math.sin(4*p);});
  const alpha=Math.atan2(sy,sx)/4;
  const match=phis.map(p=>{const d=((p-alpha)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);return Math.round(d/(Math.PI/2))%4;});
  return {score, raw, pts, center:[rc[0],0,rc[2]], alpha, tips, match};
}
function gradeFor(s){
  if(s>=92) return ["S","Perfect peel. Emoji-grade splay!"];
  if(s>=80) return ["A","Beautiful. Almost cartoon-perfect."];
  if(s>=65) return ["B","Nicely splayed, a flap or two off."];
  if(s>=45) return ["C","A bit of a tangle."];
  return ["D","Banana chaos. Try a softer, spin-free toss."];
}

/* ---------- DOM + state ---------- */
const hintEl=document.getElementById("hint");
const resultEl=document.getElementById("result");
let state="aim"; // aim | drag | flight | wait | compare | done
let grab=null, hist=[], flight=null, result=null, compareT=0, compareFrom=null, ghostPos=null, hintTimer=null;
let cardShown=false, burstDone=false;
function setHint(t,warn=false){ hintEl.textContent=t; hintEl.classList.toggle("warn",warn); }

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=stage.clientWidth; Hh=stage.clientHeight;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(Hh*dpr);
  if(renderer){ renderer.setPixelRatio(dpr); renderer.setSize(W,Hh,false); }
  camera.aspect=W/Math.max(1,Hh); camera.updateProjectionMatrix();
  const rw=refCanvas.clientWidth, rh=refCanvas.clientHeight;
  if(refRenderer&&rw){ refRenderer.setPixelRatio(dpr); refRenderer.setSize(rw,rh,false); refCam.aspect=rw/rh; refCam.updateProjectionMatrix(); }
}
new ResizeObserver(resize).observe(stage);
resize();

function localPoint(e){ const r=canvas.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
canvas.addEventListener("pointerdown",e=>{
  if(state!=="aim") return;
  const [sx,sy]=localPoint(e), g=planePoint(sx,sy);
  if(!g) return;
  canvas.setPointerCapture(e.pointerId);
  pinCore();
  state="drag"; canvas.classList.add("grabbing");
  grab={g0:g,c0:kin.c.slice()};
  hist=[{t:e.timeStamp,p:kin.c.slice()}];
  setHint("Swing it and let go…");
});
canvas.addEventListener("pointermove",e=>{
  if(state!=="drag") return;
  const [sx,sy]=localPoint(e), g=planePoint(sx,sy);
  if(!g) return;
  kin.target=[clamp(grab.c0[0]+g[0]-grab.g0[0],-8,8), clamp(grab.c0[1]+g[1]-grab.g0[1],0.8,6), 0];
  const now=e.timeStamp;
  hist.push({t:now,p:kin.target.slice()});
  while(hist.length>2&&now-hist[0].t>300) hist.shift();
});
function endDrag(e){
  if(state!=="drag") return;
  canvas.classList.remove("grabbing");
  let v=[0,0,0];
  const now=e&&e.timeStamp?e.timeStamp:performance.now();
  let recent=hist.filter(h=>now-h.t<140);
  if(recent.length<2) recent=hist.slice(-2).filter(h=>now-h.t<350);
  if(recent.length>=2){
    const a=recent[0], b=recent[recent.length-1], dt=Math.max(0.016,(b.t-a.t)/1000);
    v=mul(sub(b.p,a.p),1/dt);
  }
  v[2]=0;
  const sp=len(v); if(sp>17) v=mul(v,17/sp);
  if(len(sub(kin.c,grab.c0))<0.12&&sp<1.5){ kin.target=grab.c0.slice(); state="aim"; setHint("Drag the peel and fling it up. Let go to throw."); return; }
  launch(v);
}
canvas.addEventListener("pointerup",endDrag);
canvas.addEventListener("pointercancel",endDrag);

function launch(v,spin=1){
  release(v,spin);
  const c=coreCentroid();
  flight={t:0,startY:c[1],apex:c[1],touched:false,calm:0,grounded:0};
  state="flight";
  setHint("Wheee…");
}
function autoToss(){
  if(state==="done") resetRound();
  if(state!=="aim") return;
  kin.tiltRate=rand(-2,2);
  launch([rand(-2.5,2.5),rand(8,11.5),0],1.2);
}
document.getElementById("auto").addEventListener("click",autoToss);
canvas.addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="Enter"){ e.preventDefault(); autoToss(); }
  if(e.key==="r"&&state==="done") resetRound();
});
document.getElementById("again").addEventListener("click",()=>{resetRound(); canvas.focus();});

function resetRound(){
  resetPeel(); state="aim"; result=null; ghostPos=null; compareT=0; cardShown=false; burstDone=false;
  resultEl.hidden=true; stage.classList.remove("comparing");
  document.getElementById("res-grade").classList.remove("on");
  setHint("Drag the peel and fling it up. Let go to throw.");
}

/* Scoring waits until the peel is at rest ON the floor: many points in floor
   contact, the neck down low, and nothing moving, held for a full second.
   A touch-and-bounce resets the timer. */
function physicsTick(h){
  step(h);
  if(state==="aim"||state==="drag") return;
  if(state!=="flight") return;
  const f=flight; f.t+=h;
  const c=coreCentroid(); f.apex=Math.max(f.apex,c[1]);
  let maxV=0, contacts=0, lowCore=Infinity;
  for(let i=0;i<P.length;i++){
    if(P[i][1]<=GR+0.02) contacts++;
    const v=len(sub(P[i],Q[i]))/h; if(v>maxV) maxV=v;
  }
  for(const i of topo.core) lowCore=Math.min(lowCore,P[i][1]);
  if(contacts>0&&!f.touched){ f.touched=true; }
  const onFloor=contacts>=4&&lowCore<0.3;
  if(onFloor) f.grounded+=h; else f.grounded=0;
  if(onFloor&&maxV<0.2) f.calm+=h; else f.calm=0;
  if(f.touched&&state==="flight"){
    if(f.t>9) extraDamp=0.985;
    if(f.calm>0.15) setHint("Settling on the floor…");
    else if(!onFloor&&f.touched) setHint("Bounce! Waiting for it to land for good…");
  }
  if(f.calm>=1.0||(f.t>16&&f.grounded>1.5)) finishFlight();
}

function finishFlight(){
  if(flight.apex-flight.startY<0.4){
    state="wait";
    setHint("Too gentle. Fling it higher into the air!",true);
    clearTimeout(hintTimer);
    hintTimer=setTimeout(resetRound,1400);
    return;
  }
  result=evaluate(P);
  const [grade,verdict]=gradeFor(result.score);
  result.grade=grade; result.verdict=verdict;
  ghostPos=posePositions(Math.PI/2,[result.center[0],0.02,result.center[2]],result.alpha);
  compareFrom={target:camTarget.slice(),dist:camDist,pitch:camPitch};
  compareT=0; state="compare"; stage.classList.add("comparing");
  setHint("Resting still. Comparing with the perfect peel…");
  result.rankAtThrow=boardRows.filter(r=>r.score>result.score).length+1;
  saveThrow(result);
}

function prepareCard(){
  document.getElementById("res-score").textContent="0";
  const g=document.getElementById("res-grade"); g.textContent=result.grade; g.classList.remove("on");
  document.getElementById("res-verdict").textContent=result.verdict;
  const ul=document.getElementById("res-metrics"); ul.textContent="";
  METRICS.forEach(([k,label,subl,w],i)=>{
    const li=document.createElement("li");
    const lab=document.createElement("span"); lab.className="m-label"; lab.textContent=label;
    const it=document.createElement("i"); it.textContent=subl; lab.appendChild(it);
    const pts=document.createElement("span"); pts.className="m-pts"; pts.textContent=`${result.pts[k].toFixed(1)}/${w}`;
    const bar=document.createElement("div"); bar.className="bar";
    const fillEl=document.createElement("span"); fillEl.style.transitionDelay=`${0.15+i*0.14}s`; bar.appendChild(fillEl);
    li.append(lab,pts,bar); ul.appendChild(li);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{fillEl.style.width=`${clamp(result.pts[k]/w,0,1)*100}%`;}));
  });
  const li=document.createElement("li");
  const lab=document.createElement("span"); lab.className="m-label"; lab.textContent="Difficulty curve";
  const it=document.createElement("i"); it.textContent=`${result.raw.toFixed(1)} raw → ${result.score}`; lab.appendChild(it);
  li.appendChild(lab); ul.appendChild(li);
  resultEl.hidden=false;
}

/* ---------- main loop ---------- */
let last=performance.now(), acc=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==="aim"||state==="drag"||state==="flight"||state==="wait"){
    acc+=dt; let n=0;
    while(acc>=H_STEP&&n<8){ physicsTick(H_STEP); acc-=H_STEP; n++; }
    if(n>=8) acc=0;
  }
  updateCamera(dt);
  applyCamera();
  if(renderer){
    peel.update(P);
    const c=coreCentroid();
    sun.target.position.set(c[0],0,c[2]); sun.position.set(c[0]+3.5,9,c[2]+4.5);
    renderer.render(scene,camera);
  }
  fx.setTransform(dpr,0,0,dpr,0,0); fx.clearRect(0,0,W,Hh);
  if(state==="compare"||state==="done") drawCompare(dt);
  drawConfetti(dt);
  drawRef(now/1000);
  requestAnimationFrame(frame);
}

function updateCamera(dt){
  const k=1-Math.exp(-dt*4);
  let t,d,p;
  if(state==="aim"||state==="drag"){ t=[kin.c[0]*0.3,1.3,0]; d=6.2; p=0.2; }
  else if(state==="flight"||state==="wait"){
    const c=coreCentroid();
    t=[c[0],clamp(c[1]*0.55+0.5,1.0,6),c[2]*0.5]; d=6.2+Math.max(0,c[1]-3)*0.9; p=0.22;
  }
  if(t){
    camTarget=[lerp(camTarget[0],t[0],k),lerp(camTarget[1],t[1],k),lerp(camTarget[2],t[2],k)];
    camDist=lerp(camDist,d,k); camPitch=lerp(camPitch,p,k);
    return;
  }
  compareT+=dt;
  const dur=reduceMotion?0.3:1.4, e=ease(clamp(compareT/dur,0,1));
  const endDist=7.6, wpp=worldPerPx(endDist);
  const off=W>560?[(Math.min(330,W-32)+16)/2*wpp,0,0]:[0,0,(resultEl.offsetHeight||300)/2*wpp*0.9];
  const endT=add(result.center,off);
  camTarget=[lerp(compareFrom.target[0],endT[0],e),lerp(compareFrom.target[1],endT[1],e),lerp(compareFrom.target[2],endT[2],e)];
  camDist=lerp(compareFrom.dist,endDist,e);
  camPitch=lerp(compareFrom.pitch,1.47,e);
}

function drawGhost(gpos,alpha){
  fx.save();
  fx.setLineDash([8,6]); fx.lineWidth=2.2; fx.lineJoin="round";
  fx.strokeStyle=`rgba(255,255,255,${0.95*alpha})`;
  fx.fillStyle=`rgba(255,255,255,${0.16*alpha})`;
  const shape=pts=>{
    const pr=pts.map(p=>proj([p[0],p[1]+0.03,p[2]])); if(pr.some(x=>!x)) return;
    fx.beginPath(); pr.forEach((p,i)=>i?fx.lineTo(p[0],p[1]):fx.moveTo(p[0],p[1])); fx.closePath(); fx.fill(); fx.stroke();
  };
  topo.flaps.forEach(rows=>{
    const left=rows.map(r=>gpos[r[0]]), right=rows.map(r=>gpos[r[2]]).reverse();
    shape([...left,...right]);
  });
  const cc=result.center, circ=[]; for(let i=0;i<32;i++){const t=i/32*Math.PI*2; circ.push([cc[0]+RC*Math.cos(t),0.02,cc[2]+RC*Math.sin(t)]);}
  shape(circ);
  fx.restore();
}
function drawCompare(dt){
  const t=compareT;
  const ga=clamp((t-1.1)/0.7,0,1);
  if(ga>0){
    drawGhost(ghostPos,ga*(0.85+0.15*Math.sin(t*4)));
    const lp=clamp((t-1.5)/0.6,0,1);
    if(lp>0){
      fx.save(); fx.setLineDash([4,4]); fx.lineWidth=2.2; fx.strokeStyle="rgba(232,87,59,0.95)"; fx.fillStyle="#E8573B";
      result.tips.forEach((tip,i)=>{
        const rows=topo.flaps[result.match[i]];
        const gt=ghostPos[rows[N][1]];
        const a=proj([tip[0],Math.max(0.03,tip[1]),tip[2]]), b=proj([gt[0],0.03,gt[2]]);
        if(!a||!b) return;
        const bx=lerp(a[0],b[0],lp), by=lerp(a[1],b[1],lp);
        fx.beginPath(); fx.moveTo(a[0],a[1]); fx.lineTo(bx,by); fx.stroke();
        fx.beginPath(); fx.arc(a[0],a[1],4.5,0,Math.PI*2); fx.fill();
        fx.beginPath(); fx.arc(bx,by,3.5,0,Math.PI*2); fx.fill();
      });
      fx.restore();
    }
  }
  if(!cardShown&&t>1.6){ cardShown=true; prepareCard(); }
  if(t>1.8){
    const ct=clamp((t-1.8)/1.2,0,1);
    document.getElementById("res-score").textContent=String(Math.round(result.score*ease(ct)));
    if(ct>=1&&!burstDone){
      burstDone=true;
      document.getElementById("res-grade").classList.add("on");
      burst(result.score>=92?340:Math.round(25+result.score*2.4));
      state="done";
      setHint("Press Throw again for another go.");
    }
  }
}

function drawRef(t){
  if(!refRenderer||!refCanvas.clientWidth) return;
  refPeel.group.rotation.y=reduceMotion?0.5:t*0.35;
  refCam.position.set(0,3.1,2.3); refCam.lookAt(0,0.05,0);
  refRenderer.render(refScene,refCam);
}

/* ---------- player identity + leaderboard ---------- */
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const mintId=()=>{const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="BN-";for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s;};
const player={name:lsGet("pt_name")||"", id:lsGet("pt_id")||mintId(), uid:null};
lsSet("pt_id",player.id);
const nameInput=document.getElementById("player-name");
const idEl=document.getElementById("player-id");
nameInput.value=player.name; idEl.textContent=player.id;

let db=null, profileRef=null, boardRows=[], localRows=[], tab="top", canSave=true;
const boardList=document.getElementById("board-list"), boardNote=document.getElementById("board-note");

nameInput.addEventListener("input",()=>{ player.name=nameInput.value.trim().slice(0,20); lsSet("pt_name",player.name); renderBoard(); });
nameInput.addEventListener("change",()=>{ saveProfile(); });
nameInput.addEventListener("keydown",e=>{ if(e.key==="Enter") nameInput.blur(); });

async function saveProfile(){
  if(!profileRef) return;
  try{ await profileRef.set({playerId:player.id,name:player.name}); }catch(e){}
}

function cleanRow(id,d){
  if(!d||typeof d!=="object") return null;
  const score=Number(d.score);
  if(!isFinite(score)) return null;
  return {id, name:String(d.name||"Anonymous").slice(0,24), playerId:String(d.playerId||"").slice(0,12),
    score:clamp(Math.round(score),0,100), grade:String(d.grade||"").slice(0,2), ts:Number(d.ts)||0};
}

async function saveThrow(r){
  const doc={name:player.name||"Anonymous", playerId:player.id, score:r.score, grade:r.grade,
    metrics:r.pts, ts:Date.now()};
  if(player.uid) doc.uid=player.uid;
  const savedEl=document.getElementById("res-saved");
  const total=(db?boardRows.length:localRows.length)+1;
  const rankTxt=`Rank #${r.rankAtThrow} of ${total} throws.`;
  if(!db){
    localRows.unshift(cleanRow("local"+doc.ts,doc)); boardRows=localRows; renderBoard();
    savedEl.textContent=`${rankTxt} The shared leaderboard isn't reachable here, so this throw is kept for this visit only.`;
    return;
  }
  if(!canSave){ savedEl.textContent=`${rankTxt} You have view-only access, so this throw wasn't added to the leaderboard.`; return; }
  savedEl.textContent=`${rankTxt} Saved as ${doc.name} · ${player.id}.`;
  try{ await db.collection("throws").add(doc); }
  catch(e){
    const code=e&&e.code;
    if(code==="invalid_argument"){ canSave=false; savedEl.textContent=`${rankTxt} You have view-only access, so this throw wasn't added to the leaderboard.`; }
    else if(code==="quota_exceeded") savedEl.textContent=`${rankTxt} The leaderboard is full, so this throw wasn't saved.`;
    else savedEl.textContent=`${rankTxt} Couldn't reach the leaderboard. This throw wasn't saved.`;
  }
}

function ago(ts){
  const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60) return "just now"; if(s<3600) return `${Math.floor(s/60)}m ago`;
  if(s<86400) return `${Math.floor(s/3600)}h ago`; return `${Math.floor(s/86400)}d ago`;
}
function topSorted(){ return boardRows.slice().sort((a,b)=>b.score-a.score||a.ts-b.ts); }

function renderBoard(){
  const top=topSorted();
  const list=tab==="top"?top.slice(0,30):boardRows.slice().sort((a,b)=>b.ts-a.ts).slice(0,30);
  boardList.textContent="";
  if(!list.length){
    const li=document.createElement("li"); li.className="empty";
    li.textContent="No throws yet. Fling the peel to claim the top spot.";
    boardList.appendChild(li);
  }
  list.forEach((r,i)=>{
    const li=document.createElement("li"); li.className="row"+(r.playerId===player.id?" me":"");
    const rank=document.createElement("span");
    const rk=tab==="top"?i+1:top.indexOf(r)+1;
    rank.className="rank"+(rk<=3?" r"+rk:""); rank.textContent=String(rk);
    const who=document.createElement("div"); who.className="who";
    const nm=document.createElement("span"); nm.className="nm"; nm.textContent=r.name;
    const sub=document.createElement("span"); sub.className="sub";
    const pid=document.createElement("span"); pid.className="pid"; pid.textContent=r.playerId||"—";
    const tm=document.createElement("span"); tm.textContent=ago(r.ts);
    sub.append(pid,tm);
    if(r.playerId===player.id){ const y=document.createElement("span"); y.className="you"; y.textContent="you"; sub.appendChild(y); }
    who.append(nm,sub);
    const pts=document.createElement("div"); pts.className="pts";
    const b=document.createElement("b"); b.textContent=String(r.score);
    const g=document.createElement("span"); g.className="g"; g.textContent=r.grade;
    pts.append(b,g);
    li.append(rank,who,pts); boardList.appendChild(li);
  });
  const mine=boardRows.filter(r=>r.playerId===player.id);
  document.getElementById("my-throws").textContent=String(mine.length);
  const best=mine.reduce((m,r)=>Math.max(m,r.score),-1);
  document.getElementById("my-best").textContent=best>=0?String(best):"–";
  const bestIdx=top.findIndex(r=>r.playerId===player.id);
  document.getElementById("my-rank").textContent=bestIdx>=0?"#"+(bestIdx+1):"–";
}
function setTab(t){
  tab=t;
  document.getElementById("tab-top").setAttribute("aria-selected",String(t==="top"));
  document.getElementById("tab-recent").setAttribute("aria-selected",String(t==="recent"));
  renderBoard();
}
document.getElementById("tab-top").addEventListener("click",()=>setTab("top"));
document.getElementById("tab-recent").addEventListener("click",()=>setTab("recent"));
setInterval(renderBoard,30000);

(async function connect(){
  const api=window.claude;
  if(!api||typeof api.use!=="function"){ offline(); return; }
  try{
    const [d,u]=await Promise.all([api.use("db"),api.use("user")]);
    if(!d){ offline(); return; }
    db=d;
    if(u){
      const canW=await u.can("data.write");
      if(canW===false){ canSave=false; boardNote.textContent="You can view the leaderboard, but your throws won't be saved (view-only access)."; }
      player.uid=await u.id();
      if(player.uid){
        profileRef=db.doc("data/users/"+player.uid+"/profile");
        try{
          const snap=await profileRef.get();
          const data=snap.exists?snap.data():null;
          if(data&&typeof data.playerId==="string"&&/^BN-[A-Z0-9]{4}$/.test(data.playerId)){
            player.id=data.playerId; lsSet("pt_id",player.id); idEl.textContent=player.id;
            if(!player.name&&data.name){ player.name=String(data.name).slice(0,20); nameInput.value=player.name; lsSet("pt_name",player.name); }
          } else if(canSave){ saveProfile(); }
        }catch(e){}
      }
    }
    db.collection("throws").orderBy("ts","desc").limit(400).onSnapshot(snap=>{
      boardRows=snap.docs.map(s=>cleanRow(s.id,s.data())).filter(Boolean);
      renderBoard();
    },err=>{ boardNote.textContent="The leaderboard stopped updating. Reload the page to reconnect."; });
  }catch(e){ offline(); }
})();
function offline(){
  db=null; boardRows=localRows; renderBoard();
  boardNote.textContent="Scores on this page are kept for this visit only.";
}


resetPeel();
requestAnimationFrame(frame);
})();
</script>
