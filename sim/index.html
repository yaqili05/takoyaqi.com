<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>soft arm — interactive simulation</title>
<style>
:root{--ink:#333;--text:#777;--muted:#aaa;--line:#e6e6e6;--hot:#d9463b;--font:Arial,"Helvetica Neue",Helvetica,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;color:var(--text);font:13px/1.5 var(--font);text-transform:lowercase;overflow:hidden}
#view{position:absolute;inset:0;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
.panel{position:absolute;background:rgba(255,255,255,.9);border:1px solid var(--line);padding:12px 14px;letter-spacing:.5px;backdrop-filter:blur(4px)}
#modes{top:12px;left:12px;display:flex;flex-direction:column;gap:10px;width:268px}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1;background:#fff;border:0;border-right:1px solid var(--line);font:inherit;text-transform:inherit;color:var(--muted);padding:6px 4px;cursor:pointer;letter-spacing:1px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.seg.small button{padding:4px 4px;font-size:12px}
.hint{font-size:12px;color:var(--text)}
.sub{display:none;flex-direction:column;gap:6px}
.sub.show{display:flex}
.sub label.chk{display:flex}
.sub label:not(.chk){display:grid;grid-template-columns:48px 1fr 30px;align-items:center;gap:8px;font-size:12px}
input[type=range]{width:100%;accent-color:#555}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chk{display:flex;gap:6px;align-items:center;font-size:12px;cursor:pointer}
.link{background:none;border:0;font:inherit;text-transform:inherit;color:var(--ink);border-bottom:1px solid var(--line);cursor:pointer;font-size:12px;letter-spacing:.5px}
#sensor{top:12px;right:12px;width:180px;text-align:center}
#sensor h4,#readout h4{font-weight:normal;color:var(--ink);letter-spacing:1px;margin-bottom:8px;font-size:12px}
.ring{position:relative;width:110px;height:110px;margin:4px auto 8px}
.ring .core{position:absolute;inset:34px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
.pad{position:absolute;width:20px;height:20px;border-radius:50%;background:#eee;border:1px solid #ddd;transition:background .12s,box-shadow .12s}
.pad.on{background:var(--hot);border-color:var(--hot);box-shadow:0 0 10px rgba(217,70,59,.55)}
#status{font-size:12px;color:var(--ink);min-height:18px}
#readout{bottom:12px;right:12px;width:210px;font-size:12px}
.bar{display:grid;grid-template-columns:48px 1fr 30px;gap:8px;align-items:center;margin:3px 0}
.bar i{display:block;height:4px;background:var(--line);position:relative}
.bar i b{position:absolute;left:0;top:0;bottom:0;background:#666}
#tip,#speed{margin-top:6px;color:var(--muted);font-size:11px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#fff;color:var(--muted);letter-spacing:1px;z-index:5}
#loading .b{width:160px;height:2px;background:var(--line);position:relative;overflow:hidden}
#loading .b i{position:absolute;inset:0;width:0;background:#777;transition:width .2s}
#help{bottom:12px;left:12px;font-size:11px;color:var(--muted);border:0;background:rgba(255,255,255,.75);padding:6px 10px}
@media (max-width:680px){
  #modes{width:auto;right:12px}
  .hint{display:none}
  #sensor{top:auto;bottom:12px;right:12px;width:124px;padding:8px}
  .ring{transform:scale(.78);margin:-10px auto -8px}
  #readout,#help{display:none}
}
</style>
</head>
<body>
<div id="view"></div>
<div id="loading"><span id="lmsg">loading mujoco…</span><div class="b"><i id="lbar"></i></div></div>

<div class="panel" id="modes">
  <div class="seg" id="seg">
    <button data-m="reach" class="on">reach</button>
    <button data-m="path">path</button>
    <button data-m="react">react</button>
    <button data-m="ropes">ropes</button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="sub" id="sub-path">
    <div class="seg small" id="pathseg">
      <button data-p="arc" class="on">arc</button>
      <button data-p="line">line</button>
      <button data-p="hi">write "hi"</button>
    </div>
    <label class="chk"><input type="checkbox" id="avoid" checked> contact-aware (back off, then continue)</label>
  </div>
  <div class="sub" id="sub-ropes">
    <label>rope 1<input type="range" min="0" max="10" step="0.01" value="0" data-r="0"><span>0.0</span></label>
    <label>rope 2<input type="range" min="0" max="10" step="0.01" value="0" data-r="1"><span>0.0</span></label>
    <label>rope 3<input type="range" min="0" max="10" step="0.01" value="0" data-r="2"><span>0.0</span></label>
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="cloud"> reachable workspace</label>
    <button class="link" id="reset">reset</button>
  </div>
</div>

<div class="panel" id="sensor">
  <h4>tip contact sensor</h4>
  <div class="ring" id="ring"><div class="core">8 pads</div></div>
  <div id="status">no contact</div>
</div>

<div class="panel" id="readout">
  <h4>rope tension (ctrl)</h4>
  <div class="bar"><span>rope 1</span><i><b id="b0"></b></i><span id="v0">0</span></div>
  <div class="bar"><span>rope 2</span><i><b id="b1"></b></i><span id="v1">0</span></div>
  <div class="bar"><span>rope 3</span><i><b id="b2"></b></i><span id="v2">0</span></div>
  <div id="tip">tip —</div>
  <div id="speed">—</div>
</div>

<div class="panel" id="help">drag the yellow cylinder · drag empty space to orbit · scroll to zoom</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import loadMujoco from 'https://cdn.jsdelivr.net/npm/@mujoco/mujoco@3.14.0/mujoco.js';

/* ------------------------------------------------------------------
   soft arm — live MuJoCo simulation in the browser (wasm)
   · 8 origami modules, 3 rope actuators, free cylinder on a desk
   · physics runs live (dt = 4 ms); the arm really pushes / is pushed
   · inverse control: k-NN over a dataset of settled (rope ctrl -> tip)
     samples of this model, plus a local-Jacobian closed-loop correction
   · path following: waypoints -> k-NN controls -> [1,2,1]/4 smoothing
   · tip contact sensor: 8 binary pads from MuJoCo contacts each frame
   ------------------------------------------------------------------ */

const STL = ['bottom_4x','bottom_collision','cylinder_base','rib_seg2','rib_seg3L','rib_seg3R',
             'rib_seg4','rib_seg5L','rib_seg5R','rib_seg6','top_4x'];
const DESK_Z = 0.728, CYL_R = 0.02, CYL_H = 0.10, CMAX = 10;
const CYL_HOME = { reach:[0.075,-0.13], path:[0.06,-0.12], react:[0.09,-0.035], ropes:[-0.16,0.05] };
const $ = id => document.getElementById(id);
const prog = (p, msg) => { $('lbar').style.width = (p*100)+'%'; if (msg) $('lmsg').textContent = msg; };

// ---------- load ----------
const mj = await loadMujoco();
prog(.25, 'loading model…');
mj.FS.mkdir('/m'); mj.FS.mkdir('/m/STL');
const files = ['scene_web.xml','module1_8.xml','object_web.xml', ...STL.map(s => `STL/${s}.stl`)];
let nDone = 0;
await Promise.all(files.map(async f => {
  const buf = new Uint8Array(await (await fetch('model/' + f)).arrayBuffer());
  mj.FS.writeFile('/m/' + f, buf); prog(.25 + .5 * (++nDone / files.length));
}));
const DS = new Float32Array(await (await fetch('dataset.f32')).arrayBuffer());   // [c1 c2 c3 x y z] per sample
const PATHS = await (await fetch('paths.json')).json();
const N = DS.length / 6;
prog(.85, 'compiling model…');
await new Promise(r => setTimeout(r, 30));
const model = mj.MjModel.from_xml_path('/m/scene_web.xml');
const data = new mj.MjData(model);
const DT = model.opt.timestep;

const OBJ = mj.mjtObj, id = (t, n) => mj.mj_name2id(model, t.value, n);
const tipBody = id(OBJ.mjOBJ_BODY, 'm8_bottom'), tipSite = id(OBJ.mjOBJ_SITE, 'attach_small');
const tubeBody = id(OBJ.mjOBJ_BODY, 'tube'), deskBody = id(OBJ.mjOBJ_BODY, 'desk');
const cylCol = id(OBJ.mjOBJ_GEOM, 'cylinder_base_col'), cylVis = id(OBJ.mjOBJ_GEOM, 'cylinder_base_vis');
const tubeQ = model.jnt_qposadr[id(OBJ.mjOBJ_JOINT, 'tube_free')], tubeV = model.jnt_dofadr[id(OBJ.mjOBJ_JOINT, 'tube_free')];

function placeCylinder(x, y){
  const q = data.qpos; q[tubeQ]=x; q[tubeQ+1]=y; q[tubeQ+2]=DESK_Z; q[tubeQ+3]=1; q[tubeQ+4]=0; q[tubeQ+5]=0; q[tubeQ+6]=0;
  const v = data.qvel; for (let k=0;k<6;k++) v[tubeV+k] = 0;
}
function resetSim(){
  mj.mj_resetDataKeyframe(model, data, 0);
  placeCylinder(...CYL_HOME[mode]); data.ctrl.set([0,0,0]); ctrl.fill(0); ctrlTarget.fill(0);
  mj.mj_forward(model, data); trail.reset(); simClock = 0; wallClock = 0;
}

// ---------- three.js ----------
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(36, 1, 0.01, 20);
camera.up.set(0,0,1); camera.position.set(0.6, 0.02, 1.1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.19, 0.78); controls.enableDamping = true; controls.minDistance = .25; controls.maxDistance = 2.5;
scene.add(new THREE.HemisphereLight(0xffffff, 0xdedad2, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.9); sun.position.set(0.5, 0.2, 1.9);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera, {left:-.6,right:.6,top:.6,bottom:-.6,near:.5,far:3}); sun.shadow.bias = -0.0004;
sun.target.position.set(0,-0.2,0.73); scene.add(sun, sun.target);

const mats = {
  arm:  new THREE.MeshStandardMaterial({ color:0xe9e7e2, roughness:.62 }),
  tip:  new THREE.MeshStandardMaterial({ color:0xb9b6ae, roughness:.55 }),
  hot:  new THREE.MeshStandardMaterial({ color:0xd9463b, roughness:.5, emissive:0x5a0d08 }),
  cyl:  new THREE.MeshStandardMaterial({ color:0xd8b54f, roughness:.5 }),
  desk: new THREE.MeshStandardMaterial({ color:0xf3f1ec, roughness:.9 }),
};
const geomCache = new Map();
function meshGeometry(mid){
  if (geomCache.has(mid)) return geomCache.get(mid);
  const va = model.mesh_vertadr[mid], vn = model.mesh_vertnum[mid], fa = model.mesh_faceadr[mid], fn = model.mesh_facenum[mid];
  let g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(model.mesh_vert.slice(3*va, 3*(va+vn))), 3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(model.mesh_face.slice(3*fa, 3*(fa+fn))), 1));
  g = g.toNonIndexed(); g.computeVertexNormals(); geomCache.set(mid, g); return g;
}
const rgba = model.geom_rgba.slice(), gtype = model.geom_type.slice(), gdata = model.geom_dataid.slice(),
      gsize = model.geom_size.slice(), gbody = model.geom_bodyid.slice();
const drawn = []; let cylMesh = null; const tipMeshes = [];
for (let g=0; g<model.ngeom; g++){
  if (rgba[4*g+3] === 0) continue;
  let geo, mat = mats.arm;
  if (gtype[g] === mj.mjtGeom.mjGEOM_MESH.value) geo = meshGeometry(gdata[g]);
  else if (gtype[g] === mj.mjtGeom.mjGEOM_BOX.value) geo = new THREE.BoxGeometry(2*gsize[3*g], 2*gsize[3*g+1], 2*gsize[3*g+2]);
  else continue;
  if (g === cylVis) mat = mats.cyl; else if (gbody[g] === deskBody) mat = mats.desk; else if (gbody[g] === tipBody) mat = mats.tip;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.matrixAutoUpdate = false; mesh.castShadow = gbody[g] !== deskBody; mesh.receiveShadow = true;
  scene.add(mesh); drawn.push([g, mesh]);
  if (g === cylVis) cylMesh = mesh;
  if (mat === mats.tip) tipMeshes.push(mesh);
}
// workspace cloud = dataset tips
const cloudPos = new Float32Array(3*N); for (let i=0;i<N;i++) for (let k=0;k<3;k++) cloudPos[3*i+k] = DS[6*i+3+k];
const cloud = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(cloudPos,3)),
  new THREE.PointsMaterial({ color:0x8a8a8a, size:0.004, transparent:true, opacity:.5, depthWrite:false }));
cloud.visible = false; scene.add(cloud);
const marker = new THREE.Mesh(new THREE.SphereGeometry(0.006, 16, 12), new THREE.MeshBasicMaterial({ color:0x333333 }));
marker.visible = false; scene.add(marker);
// path (target) + tip trail
const pathLine = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineDashedMaterial({ color:0x9a9a9a, dashSize:.006, gapSize:.004 }));
pathLine.visible = false; scene.add(pathLine);
const trail = (() => {
  const MAX = 1500, pos = new Float32Array(3*MAX*2); let n = 0, last = null;
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const line = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color:0x2d6cdf })); scene.add(line); geo.setDrawRange(0,0);
  return {
    add(p, pen){ if (last && pen && n < MAX){ pos.set(last, 6*n); pos.set(p, 6*n+3); n++; geo.attributes.position.needsUpdate = true; geo.setDrawRange(0, 2*n); }
                 last = p.slice(); },
    reset(){ n = 0; last = null; geo.setDrawRange(0,0); }, line
  };
})();

// ---------- inverse control ----------
function nearest(query, K, space){      // space 0 = ctrl, 3 = tip
  const best = [];
  for (let i=0;i<N;i++){
    const o = 6*i + space, dx = DS[o]-query[0], dy = DS[o+1]-query[1], dz = DS[o+2]-query[2], d2 = dx*dx+dy*dy+dz*dz;
    if (best.length < K || d2 < best[best.length-1][0]){ best.push([d2,i]); best.sort((a,b)=>a[0]-b[0]); if (best.length > K) best.pop(); }
  }
  return best;
}
function knnCtrl(tip){                   // inverse-distance-weighted k-NN, k = 6
  const nb = nearest(tip, 6, 3), c = [0,0,0]; let ws = 0;
  for (const [d2,i] of nb){ const w = 1/(Math.sqrt(d2)+1e-4); ws += w; for (let k=0;k<3;k++) c[k] += w*DS[6*i+k]; }
  return c.map(v => v/ws);
}
function localJacobian(ctrlNow){         // tip ~ A c + b from the 16 nearest samples in ctrl space
  const nb = nearest(ctrlNow, 16, 0), X = [], Y = [];
  for (const [,i] of nb){ X.push([DS[6*i],DS[6*i+1],DS[6*i+2],1]); Y.push([DS[6*i+3],DS[6*i+4],DS[6*i+5]]); }
  const XtX = Array.from({length:4},()=>[0,0,0,0]), XtY = Array.from({length:4},()=>[0,0,0]);
  for (let r=0;r<X.length;r++) for (let a=0;a<4;a++){ for (let b=0;b<4;b++) XtX[a][b]+=X[r][a]*X[r][b]; for (let k=0;k<3;k++) XtY[a][k]+=X[r][a]*Y[r][k]; }
  for (let a=0;a<3;a++) XtX[a][a] += 1e-3;
  const B = solve(XtX, XtY);             // 4x3; rows 0..2 = A^T
  return [[B[0][0],B[1][0],B[2][0]],[B[0][1],B[1][1],B[2][1]],[B[0][2],B[1][2],B[2][2]]];
}
function solve(A, Bm){                   // gaussian elimination, A n x n, Bm n x m
  const n = A.length, M = A.map((r,i)=>[...r, ...Bm[i]]), m = Bm[0].length;
  for (let c=0;c<n;c++){ let p=c; for (let r=c+1;r<n;r++) if (Math.abs(M[r][c])>Math.abs(M[p][c])) p=r; [M[c],M[p]]=[M[p],M[c]];
    const d = M[c][c] || 1e-9; for (let j=c;j<n+m;j++) M[c][j]/=d;
    for (let r=0;r<n;r++) if (r!==c){ const f=M[r][c]; for (let j=c;j<n+m;j++) M[r][j]-=f*M[c][j]; } }
  return M.map(r => r.slice(n));
}
function dampedStep(J, e, lam = 0.02){   // (J^T J + lam I)^-1 J^T e
  const JtJ = [[0,0,0],[0,0,0],[0,0,0]], Jte = [[0],[0],[0]];
  for (let a=0;a<3;a++){ for (let b=0;b<3;b++){ for (let k=0;k<3;k++) JtJ[a][b]+=J[k][a]*J[k][b]; } for (let k=0;k<3;k++) Jte[a][0]+=J[k][a]*e[k]; JtJ[a][a]+=lam*1e-3; }
  return solve(JtJ, Jte).map(r => r[0]);
}
const clampC = c => c.map(v => Math.min(CMAX, Math.max(0, v)));

// ---------- state ----------
let mode = 'reach', pathName = 'arc';
const ctrl = new Float64Array(3), ctrlTarget = new Float64Array(3), manual = [0,0,0];
let simClock = 0, wallClock = 0, lastTipContact = -1e9, lastContact = -1e9, contactAt = null;
let refineT = 0, lastTarget = null, refined = [0,0,0];
const path = { pts:[], draw:[], ctrls:[], k:0, t:0, dwell:0.45, backoff:0, away:null, corr:[0,0,0], ct:0 };
const padLit = new Float32Array(8);

const HINTS = {
  reach: 'drag the cylinder around. the arm picks rope tensions from its dataset (k-nn), then corrects them in closed loop until the tip pads touch.',
  path:  'the tip follows a path: waypoints → k-nn rope commands → smoothing. put the cylinder in the way — on contact it backs off, then continues.',
  react: 'the arm rests. push the cylinder into it: when the tip feels contact it withdraws away from the touch, then eases back.',
  ropes: 'pull the three ropes yourself. this is the live mujoco model — push it with the cylinder too.'
};
function buildPath(){
  const P = PATHS[pathName]; path.pts = P.pts; path.draw = P.draw || P.pts.map(() => 1);
  const raw = path.pts.map(p => knnCtrl(p));
  path.ctrls = raw.map((c,i) => { const a = raw[Math.max(0,i-1)], b = raw[Math.min(raw.length-1,i+1)]; return c.map((v,k) => (a[k]+2*v+b[k])/4); });
  path.k = 0; path.t = 0; path.backoff = 0; path.corr = [0,0,0];
  path.dwell = pathName === 'hi' ? 0.3 : 0.45;
  const seg = []; for (let i=1;i<path.pts.length;i++) if (path.draw[i] && path.draw[i-1]) seg.push(...path.pts[i-1], ...path.pts[i]);
  pathLine.geometry.dispose(); pathLine.geometry = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
  pathLine.computeLineDistances(); trail.reset();
}
function setMode(m){
  mode = m;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('hint').textContent = HINTS[m];
  $('sub-path').classList.toggle('show', m === 'path'); $('sub-ropes').classList.toggle('show', m === 'ropes');
  pathLine.visible = m === 'path'; trail.line.visible = m === 'path'; marker.visible = false;
  lastTarget = null;
  if (m === 'path') buildPath();
  if (m === 'ropes') for (let k=0;k<3;k++) manual[k] = ctrl[k];
  document.querySelectorAll('#sub-ropes input').forEach(inp => { inp.value = manual[+inp.dataset.r]; inp.nextElementSibling.textContent = (+inp.value).toFixed(1); });
  placeCylinder(...CYL_HOME[m]);
}
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => setMode(b.dataset.m));
document.querySelectorAll('#pathseg button').forEach(b => b.onclick = () => {
  pathName = b.dataset.p; document.querySelectorAll('#pathseg button').forEach(x => x.classList.toggle('on', x === b)); buildPath(); });
document.querySelectorAll('#sub-ropes input').forEach(inp => inp.oninput = () => {
  manual[+inp.dataset.r] = +inp.value; inp.nextElementSibling.textContent = (+inp.value).toFixed(1); });
$('cloud').onchange = e => cloud.visible = e.target.checked;
$('reset').onclick = () => { resetSim(); if (mode === 'path') buildPath(); };

// sensor ring
const pads = [];
for (let k=0;k<8;k++){ const a = k/8*Math.PI*2 - Math.PI/2, el = document.createElement('div');
  el.className = 'pad'; el.style.left = (45 + 42*Math.cos(a)) + 'px'; el.style.top = (45 + 42*Math.sin(a)) + 'px'; $('ring').appendChild(el); pads.push(el); }

// ---------- dragging the cylinder (spring force on the free body) ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0,0,1), -(DESK_Z + CYL_H/2));
let drag = null;
function setRay(e){ const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc, camera); }
renderer.domElement.addEventListener('pointerdown', e => {
  setRay(e); if (!ray.intersectObject(cylMesh).length) return;
  const p = new THREE.Vector3(); ray.ray.intersectPlane(dragPlane, p);
  const xp = data.xpos; drag = { off:[p.x - xp[3*tubeBody], p.y - xp[3*tubeBody+1]], goal:[xp[3*tubeBody], xp[3*tubeBody+1]] };
  controls.enabled = false; renderer.domElement.setPointerCapture(e.pointerId); view.style.cursor = 'grabbing';
});
renderer.domElement.addEventListener('pointermove', e => {
  setRay(e);
  if (!drag){ view.style.cursor = ray.intersectObject(cylMesh).length ? 'grab' : ''; return; }
  const p = new THREE.Vector3(); if (ray.ray.intersectPlane(dragPlane, p)) drag.goal = [p.x - drag.off[0], p.y - drag.off[1]];
});
const endDrag = () => { drag = null; controls.enabled = true; view.style.cursor = ''; data.xfrc_applied.fill(0); };
renderer.domElement.addEventListener('pointerup', endDrag); renderer.domElement.addEventListener('pointercancel', endDrag);
function applyDrag(){
  if (!drag) return;
  const xp = data.xpos, v = data.qvel, f = data.xfrc_applied, b = 6*tubeBody;
  const gx = Math.max(-0.5, Math.min(0.5, drag.goal[0])), gy = Math.max(-0.35, Math.min(0.35, drag.goal[1]));
  f[b]   = 6*(gx - xp[3*tubeBody])   - 0.9*v[tubeV];
  f[b+1] = 6*(gy - xp[3*tubeBody+1]) - 0.9*v[tubeV+1];
  f[b+3] = -0.004*v[tubeV+3]; f[b+4] = -0.004*v[tubeV+4]; f[b+5] = -0.002*v[tubeV+5];   // keep it upright-ish
}

// ---------- sensing ----------
function sense(){
  const cv = data.contact, n = data.ncon, xp = data.xpos, xm = data.xmat;
  const tp = [xp[3*tipBody], xp[3*tipBody+1], xp[3*tipBody+2]], R = xm.slice(9*tipBody, 9*tipBody+9);
  let any = 0, tip = false, sum = [0,0,0];
  for (let i=0;i<n;i++){
    const c = cv.get(i), g1 = c.geom1, g2 = c.geom2, p = c.pos, px = p[0], py = p[1], pz = p[2]; c.delete();
    if (g1 !== cylCol && g2 !== cylCol) continue;
    const other = g1 === cylCol ? g2 : g1; if (gbody[other] === deskBody) continue;
    any++; sum[0]+=px; sum[1]+=py; sum[2]+=pz;
    const dx = px-tp[0], dy = py-tp[1], dz = pz-tp[2];
    if (Math.hypot(dx,dy,dz) < 0.04){
      tip = true;
      const lx = R[0]*dx + R[3]*dy + R[6]*dz, ly = R[1]*dx + R[4]*dy + R[7]*dz;
      padLit[Math.floor(((Math.atan2(ly,lx) + 2*Math.PI) % (2*Math.PI)) / (Math.PI/4))] = 1;
    }
  }

}
const tipPos = () => [data.site_xpos[3*tipSite], data.site_xpos[3*tipSite+1], data.site_xpos[3*tipSite+2]];
const cylPos = () => [data.xpos[3*tubeBody], data.xpos[3*tubeBody+1]];

// ---------- controller (runs once per rendered frame) ----------
function control(s, dt){
  const tip = tipPos(), now = simClock;
  marker.visible = false;
  if (mode === 'ropes'){ ctrlTarget.set(manual); return; }

  if (mode === 'reach'){
    const [cx, cy] = cylPos();
    let dx = tip[0]-cx, dy = tip[1]-cy; const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
    const z = Math.min(DESK_Z + CYL_H - 0.012, Math.max(DESK_Z + 0.03, tip[2]));
    const target = [cx + dx*(CYL_R-0.004), cy + dy*(CYL_R-0.004), z];
    marker.position.set(...target); marker.visible = true;
    if (now - lastTipContact < 0.3) return;                                  // touching: hold
    if (!lastTarget || Math.hypot(target[0]-lastTarget[0], target[1]-lastTarget[1]) > 0.02){
      refined = knnCtrl(target); lastTarget = target; refineT = now;          // new target: k-NN guess
    } else if (now - refineT > 0.5){                                          // settled-ish: closed-loop correction
      const e = [target[0]-tip[0], target[1]-tip[1], target[2]-tip[2]];
      if (Math.hypot(...e) > 0.003){ const d = dampedStep(localJacobian(ctrl), e); refined = clampC(refined.map((v,k) => v + 0.5*d[k])); }
      refineT = now;
    }
    ctrlTarget.set(refined); return;
  }

  if (mode === 'react'){
    if (s.any && s.at){
      let dx = tip[0]-s.at[0], dy = tip[1]-s.at[1]; const L = Math.hypot(dx,dy) || 1;
      ctrlTarget.set(knnCtrl([tip[0] + 0.07*dx/L, tip[1] + 0.07*dy/L, tip[2]]));
    } else if (now - lastContact > 0.9) ctrlTarget.fill(0);
    return;
  }

  if (mode === 'path'){
    const avoid = $('avoid').checked;
    if (avoid && s.tip && s.at && path.backoff <= 0){                         // contact: back away from the touch
      let dx = tip[0]-s.at[0], dy = tip[1]-s.at[1]; const L = Math.hypot(dx,dy) || 1;
      path.away = knnCtrl([tip[0] + 0.05*dx/L, tip[1] + 0.05*dy/L, tip[2] + 0.01]); path.backoff = 0.9;
    }
    if (path.backoff > 0){ path.backoff -= dt; ctrlTarget.set(path.away);
      if (path.backoff <= 0) path.k = Math.min(path.k + 3, path.pts.length - 1); // then skip ahead and continue
      return; }
    path.t += dt; path.ct += dt;
    if (path.t > path.dwell){ path.t = 0; path.k++;
      if (path.k >= path.pts.length){ path.k = 0; trail.reset(); } }
    const tgt = path.pts[path.k];
    if (path.ct > 0.12){                                                      // closed-loop correction on top of the k-NN feed-forward
      path.ct = 0; const e = [tgt[0]-tip[0], tgt[1]-tip[1], tgt[2]-tip[2]];
      const d = dampedStep(localJacobian(ctrl), e);
      path.corr = path.corr.map((v,k) => Math.max(-2.5, Math.min(2.5, v + 0.25*d[k])));
    }
    ctrlTarget.set(clampC(path.ctrls[path.k].map((v,k) => v + path.corr[k])));
    marker.position.set(...path.pts[path.k]); marker.visible = true;
  }
}

// ---------- main loop ----------
function resize(){ const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const m4 = new THREE.Matrix4();
let tPrev = performance.now()/1000, speedAvg = 1;
let S = { any:0, tip:false, at:null };
window.__sim = { get: () => ({ mode, tip: tipPos(), cyl: cylPos(), ctrl: [...ctrl], contact: S, sim: simClock, target: marker.visible ? [marker.position.x, marker.position.y, marker.position.z] : null, pk: path.k, back: path.backoff }), setMode, setCyl: (x,y) => placeCylinder(x,y), setPath: p => { pathName = p; document.querySelectorAll('#pathseg button').forEach(x => x.classList.toggle('on', x.dataset.p === p)); buildPath(); } };

let NORENDER = new URLSearchParams(location.search).has('norender');
window.__render = v => { NORENDER = !v; };
const RECORD = new URLSearchParams(location.search).has('record');
window.__clean = () => { pathLine.visible = false; trail.line.visible = false; marker.material.visible = false; };
window.__cam = (p, t) => { camera.position.set(...p); controls.target.set(...t); controls.update(); };
window.__tick = (dt, draw = true) => { const r = NORENDER; NORENDER = !draw; frame(dt); NORENDER = r; };
function frame(fixed){
  const t = performance.now()/1000, rawDt = fixed || (t - tPrev), wdt = fixed || Math.min(0.05, rawDt); tPrev = t; wallClock += wdt;
  control(S, wdt);
  // physics: catch up with wall-clock time, but never spend more than ~12 ms per frame
  const c0 = performance.now(); let steps = 0;
  while (simClock < wallClock && (fixed || performance.now() - c0 < 12)){
    const rate = 6*DT;                                                         // rope tension slew limit (ctrl units / step)
    for (let k=0;k<3;k++) ctrl[k] += Math.max(-rate, Math.min(rate, ctrlTarget[k] - ctrl[k]));
    data.ctrl.set(ctrl); applyDrag(); mj.mj_step(model, data); simClock += DT; steps++;
  }
  if (simClock < wallClock - 0.1) wallClock = simClock;                        // too slow: run in slow motion
  speedAvg = 0.9*speedAvg + 0.1*Math.min(1, steps*DT / Math.max(rawDt, 1e-3));
  S = sense();
  if (S.any) lastContact = simClock;
  if (S.tip) lastTipContact = simClock;
  if (mode === 'path'){ const p = tipPos(); trail.add(p, path.draw[path.k] && path.draw[Math.max(0,path.k-1)] && path.t > 0.08 && path.backoff <= 0); }
  // a knocked-over / fallen cylinder comes back
  if (data.xpos[3*tubeBody+2] < DESK_Z - 0.05) placeCylinder(...CYL_HOME[mode]);

  // ui
  for (let k=0;k<8;k++){ padLit[k] = Math.max(0, padLit[k] - wdt*4); pads[k].classList.toggle('on', padLit[k] > 0.05); }
  const tipOn = simClock - lastTipContact < 0.15;
  tipMeshes.forEach(m => m.material = tipOn ? mats.hot : mats.tip);
  $('status').textContent = tipOn ? 'tip contact' : S.any ? `body contact (${S.any})` : 'no contact';
  $('status').style.color = tipOn ? 'var(--hot)' : '';
  for (let k=0;k<3;k++){ $('b'+k).style.width = (ctrl[k]/CMAX*100)+'%'; $('v'+k).textContent = ctrl[k].toFixed(1); }
  const tp = tipPos(); $('tip').textContent = `tip ${tp[0].toFixed(3)}, ${tp[1].toFixed(3)}, ${tp[2].toFixed(3)} m`;
  $('speed').textContent = `live physics · ${Math.round(speedAvg*100)}% real time`;

  const gp = data.geom_xpos, gm = data.geom_xmat;
  for (const [g, mesh] of drawn){ const p = 3*g, r = 9*g;
    m4.set(gm[r],gm[r+1],gm[r+2],gp[p], gm[r+3],gm[r+4],gm[r+5],gp[p+1], gm[r+6],gm[r+7],gm[r+8],gp[p+2], 0,0,0,1);
    mesh.matrix.copy(m4); mesh.matrixWorldNeedsUpdate = true; }
  controls.update(); if (!NORENDER) renderer.render(scene, camera);
  if (!fixed) requestAnimationFrame(() => frame());
}
setMode('reach'); resetSim();
prog(1); $('loading').style.display = 'none';
if (!RECORD) requestAnimationFrame(() => frame());
</script>
