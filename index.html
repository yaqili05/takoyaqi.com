<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yaqi li</title>
<meta name="description" content="yaqi li — design + research. placeholder description.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' text-anchor='middle' fill='%23777'%3Ey%3C/text%3E%3C/svg%3E">
<style>
/* ---------------------------------------------------------------
   takoyaqi.com — structure after selfassemblylab.mit.edu,
   look after paulpettigrewarchitect.com (arial, lowercase, grey,
   centered, lots of white, image-led grid with hover labels)
   --------------------------------------------------------------- */
:root{
  --bg:#ffffff;
  --ink:#333333;      /* nav + strong text */
  --text:#777777;     /* body text */
  --title:#6c6c6c;    /* site title */
  --muted:#aaaaaa;
  --line:#e6e6e6;
  --tile-a:#ececec; --tile-b:#e2e2e2; --tile-c:#d9d9d9; --tile-d:#f2f2f2;
  --overlay:rgba(255,255,255,.88);
  --font: Arial, "Helvetica Neue", Helvetica, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:none}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--font);text-transform:lowercase;text-align:center;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;transition:color .2s}
a:hover{color:var(--ink)}
img{display:block;max-width:100%}

/* header */
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);padding:34px 16px 14px}
.site-title{display:inline-block;color:var(--title);font-size:40px;font-weight:normal;letter-spacing:1px;line-height:1.1}
.site-sub{display:block;font-size:15px;color:var(--muted);margin-top:4px;letter-spacing:1px}
nav ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 26px;margin-top:20px}
nav a{display:block;color:var(--ink);padding:6px 0;letter-spacing:1px;border-bottom:1px solid transparent}
nav a:hover{color:#878787}
nav a.active{color:var(--muted)}

main{max-width:1320px;margin:0 auto;padding:10px 24px 80px;min-height:60vh}
.intro{max-width:620px;margin:18px auto 38px;font-size:16px}
.hello{display:flex;flex-direction:column;align-items:center;gap:0;margin:14px auto 0}
.hello .intro{margin-top:18px}
.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;display:block}
.avatar.big{width:min(280px,70vw);height:auto;aspect-ratio:1;margin:0 auto}
a.u{color:var(--ink);border-bottom:1px solid var(--line)}
h1.page{font-size:30px;font-weight:normal;color:var(--title);letter-spacing:1px;margin:30px 0 30px}
h2{font-size:22px;font-weight:normal;color:var(--title);letter-spacing:1px;margin:0 0 14px}
h3{font-size:16px;font-weight:normal;color:var(--ink);letter-spacing:1px}
p + p{margin-top:1em}

/* case study (soft arm) */
.case{max-width:1100px;margin:0 auto}
.case .lead{max-width:640px;margin:-10px auto 16px;font-size:18px;color:var(--ink);line-height:1.5}
.case .meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 24px;font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:30px}
.simwrap{position:relative;width:100%;height:50vh;min-height:320px;background:#f0eee9;overflow:hidden}
.simwrap img{width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
.simwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.launch{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;display:flex;flex-direction:column;gap:4px;align-items:center;background:rgba(255,255,255,.92);border:1px solid var(--line);padding:18px 28px;font:inherit;text-transform:inherit;letter-spacing:1px;color:var(--ink);cursor:pointer;transition:background .2s}
.launch:hover{background:#fff}
.launch small{color:var(--muted);font-size:12px}
.simlinks{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--muted);letter-spacing:.5px;margin:10px 0 0}
.simlinks a,.u{color:var(--ink);border-bottom:1px solid var(--line)}
.case section{margin:70px 0 0;text-align:left}
.case section > h2{font-size:14px;color:var(--muted);letter-spacing:2px;margin-bottom:22px}
.case section.two{display:grid;grid-template-columns:220px 1fr;gap:20px 40px}
.case section.two > h2{margin:4px 0 0}
.case section p{font-size:16px;max-width:680px}
.case .fine{font-size:13px!important;color:var(--muted);margin-top:1.2em}
.case blockquote{margin:70px auto 0;max-width:760px;font-size:22px;line-height:1.45;color:var(--title);letter-spacing:.5px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.steps .n{display:block;font-size:13px;color:var(--muted);letter-spacing:2px;border-top:1px solid var(--ink);padding-top:12px;margin-bottom:8px}
.steps h3{margin-bottom:6px}
.steps p{font-size:14px!important}
.results .row{display:grid;grid-template-columns:1fr 140px 1fr;gap:10px 24px;padding:14px 0;border-top:1px solid var(--line);align-items:baseline}
.results strong{font-weight:normal;font-size:20px;color:var(--ink)}
.results em{font-style:normal;font-size:13px;color:var(--muted)}
.contrib{list-style:none;counter-reset:c}
.contrib li{position:relative;padding:10px 0 10px 34px;border-top:1px solid var(--line);font-size:15px;max-width:720px}
.contrib li::before{counter-increment:c;content:counter(c,decimal-leading-zero);position:absolute;left:0;top:11px;font-size:12px;color:var(--muted)}
@media (max-width:760px){
  .simwrap{height:50vh;min-height:300px}
  .case section.two{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr 1fr}
  .results .row{grid-template-columns:1fr auto}
  .results em{grid-column:1 / -1}
  .case blockquote{font-size:18px}
}
/* resume */
.resume{max-width:820px;margin:30px auto 0}
.resume object{display:block;width:100%;height:80vh;min-height:520px;border:1px solid var(--line)}
.resume p{margin-top:16px;font-size:14px;letter-spacing:1px}
.resume a{color:var(--ink);border-bottom:1px solid var(--line)}

/* placeholder imagery */
.ph{position:relative;width:100%;background:var(--tile-a);display:flex;align-items:center;justify-content:center;color:#b5b5b5;font-size:12px;letter-spacing:2px}
.ph.t1{background:var(--tile-a)} .ph.t2{background:var(--tile-b)} .ph.t3{background:var(--tile-c)} .ph.t4{background:var(--tile-d)}
.ph::after{content:attr(data-label)}

/* work grid — masonry "bricks" */
.bricks{columns:4 260px;column-gap:14px}
.brick{break-inside:avoid;margin:0 0 14px;display:block;position:relative;overflow:hidden;animation:fade .5s ease both}
.brick .ph{transition:transform .6s ease}
.brick:hover .ph{transform:scale(1.03)}
.brick .label{position:absolute;inset:0;background:var(--overlay);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .35s}
.brick:hover .label,.brick:focus-visible .label{opacity:1}
.label .cat{font-size:13px;color:var(--muted);letter-spacing:1px}
.label .name{font-size:19px;color:var(--ink);letter-spacing:1px;line-height:1.3;margin-top:2px}
@media (hover:none){ .brick .label{position:static;opacity:1;background:none;padding:8px 0 4px} }
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* project page */
.project{max-width:980px;margin:0 auto}
.project .meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 28px;font-size:14px;color:var(--muted);letter-spacing:1px;margin:-14px 0 30px}
.project .body{max-width:640px;margin:36px auto;font-size:16px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.gallery .wide{grid-column:1 / -1}
.pager{display:flex;justify-content:space-between;gap:16px;margin:50px 0 0;font-size:14px;letter-spacing:1px;border-top:1px solid var(--line);padding-top:18px}

/* research */
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px 28px;text-align:center}
.theme h3{margin:16px 0 8px}
.theme p{max-width:380px;margin:0 auto}

/* lists: publications / press */
.list{max-width:760px;margin:0 auto;text-align:left}
.year{font-size:14px;color:var(--muted);letter-spacing:2px;margin:36px 0 8px;text-align:center}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 20px;padding:16px 0;border-top:1px solid var(--line)}
.item .t{color:var(--ink)}
.item .s{font-size:14px}
.item .r{font-size:13px;color:var(--muted);white-space:nowrap;align-self:start;padding-top:2px}
.item a.t:hover{color:#878787}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:48px;max-width:1040px;margin:0 auto;text-align:left;align-items:start}
.about .bio{font-size:16px}
.cv{margin-top:34px}
.cv h3{margin:28px 0 8px;color:var(--title)}
.cv li{list-style:none;display:grid;grid-template-columns:90px 1fr;gap:12px;padding:5px 0;font-size:14px}
.cv li span:first-child{color:var(--muted)}

/* collaborators */
.names{columns:3 200px;column-gap:28px;max-width:900px;margin:0 auto;font-size:15px}
.names li{list-style:none;padding:4px 0;break-inside:avoid}
.names h3{margin:0 0 10px;column-span:all}

/* contact */
.contact{max-width:560px;margin:0 auto;font-size:16px}
.contact .big{font-size:24px;color:var(--ink);letter-spacing:1px;display:inline-block;margin:10px 0 30px;border-bottom:1px solid var(--line)}
.contact dl{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;text-align:left;max-width:380px;margin:0 auto}
.contact dt{color:var(--muted)}

footer{padding:40px 16px 50px;font-size:13px;color:var(--muted);letter-spacing:1px}
footer .social{display:flex;justify-content:center;gap:22px;margin-bottom:10px}
.up{position:fixed;right:18px;bottom:18px;width:38px;height:38px;border-radius:50%;background:#999;color:#fff;border:0;font:18px var(--font);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
.up.show{opacity:.7;pointer-events:auto}
.up:hover{opacity:1}

@media (max-width:760px){
  header{padding:24px 16px 10px;position:static}
  .site-title{font-size:30px}
  nav ul{gap:0 16px;margin-top:14px}
  main{padding:10px 16px 60px}
  .about{grid-template-columns:1fr;gap:28px}
  .gallery{grid-template-columns:1fr}
  .item{grid-template-columns:1fr}
  .item .r{padding-top:0}
}
</style>
</head>
<body>

<header>
  <a href="#/" class="site-title">yaqi li</a>
  <nav><ul id="nav">
    <li><a href="#/about" data-r="about">about</a></li>
    <li><a href="#/projects" data-r="projects">projects</a></li>
    <li><a href="https://github.com/yaqili05" target="_blank" rel="noopener">github</a></li>
    <li><a href="#/resume" data-r="resume">resume</a></li>
    <li><a href="#/contact" data-r="contact">contact</a></li>
  </ul></nav>
</header>

<main id="app"></main>

<footer>
  <div class="social">
    <a href="https://github.com/yaqili05" target="_blank" rel="noopener">github</a>
    <a href="https://www.linkedin.com/in/yaqi-li-mit/" target="_blank" rel="noopener">linkedin</a>
    <a href="mailto:yaqilius@gmail.com">email</a>
  </div>
  © <span id="yr"></span> yaqi li · takoyaqi.com
</footer>

<button class="up" id="up" aria-label="back to top">↑</button>

<script>
/* =================================================================
   CONTENT — edit everything below. Replace placeholders with your own.
   To use a real image, set  img: "images/your-file.jpg"  on a project
   (or in gallery), and it will replace the grey placeholder block.
   ================================================================= */
const SITE = {
  intro: "undergraduate at mit studying computation and cognition, with a minor in design. i build intelligent systems that live alongside people — soft robots that learn by touch, multimodal machine learning, and ai for design.",
  email: "yaqilius@gmail.com",
  linkedin: "https://www.linkedin.com/in/yaqi-li-mit/",
  portrait: "images/portrait.jpg",
};

const PROJECTS = [
  // slug, title, category, year, ratio (w/h of thumbnail), optional img
  {slug:"soft-arm", title:"soft arm", cat:"research", year:2026, ratio:720/560, img:"images/soft-arm.jpg", custom:true},
  {slug:"project-two",   title:"project two",   cat:"objects",       year:2026, ratio:.75},
  {slug:"project-three", title:"project three", cat:"spaces",        year:2025, ratio:1.33},
  {slug:"project-four",  title:"project four",  cat:"installations", year:2025, ratio:1},
  {slug:"project-five",  title:"project five",  cat:"research",      year:2025, ratio:.8},
  {slug:"project-six",   title:"project six",   cat:"teaching",      year:2025, ratio:1.5},
  {slug:"project-seven", title:"project seven", cat:"objects",       year:2024, ratio:1},
  {slug:"project-eight", title:"project eight", cat:"spaces",        year:2024, ratio:.7},
  {slug:"project-nine",  title:"project nine",  cat:"research",      year:2024, ratio:1.25},
  {slug:"project-ten",   title:"project ten",   cat:"installations", year:2024, ratio:1},
  {slug:"project-eleven",title:"project eleven",cat:"objects",       year:2023, ratio:.85},
  {slug:"project-twelve",title:"project twelve",cat:"teaching",      year:2023, ratio:1.33},
  {slug:"project-thirteen",title:"project thirteen",cat:"research",  year:2023, ratio:1},
  {slug:"project-fourteen",title:"project fourteen",cat:"spaces",    year:2022, ratio:.75},
  {slug:"project-fifteen",title:"project fifteen",cat:"objects",     year:2022, ratio:1.2},
  {slug:"project-sixteen",title:"project sixteen",cat:"installations",year:2022, ratio:1},
].map(p => ({
  collaborators:"collaborator name, collaborator name",
  location:"cambridge, ma",
  text:[
    "placeholder project description. two or three sentences on the question this project asks, the material or system it works with, and what it produces.",
    "second paragraph — process, fabrication, testing, or context. where it was shown, who it was made with, what comes next."
  ],
  gallery:[{wide:true},{},{},{wide:true}],
  ...p
}));

const SOFT_ARM = {
  tagline: "a modular, cable-driven origami soft arm that learns to move — and to navigate — by touch.",
  meta: ["research", "2025–", "multisensory intelligence group, mit media lab / csail", "mujoco · python · arduino"],
  question: "can a soft continuum robot learn a tactile exploration policy in simulation that transfers to the real robot and lets it navigate unknown spaces using only contact at its tip?",
  overview: [
    "soft continuum arms are safe around people and can squeeze through places rigid robots can't, but they are hard to model and even harder to control. this arm is eight 3d-printed origami modules strung on three cables; pulling the cables bends it in 3d.",
    "i rebuilt the hardware so it can be assembled and repaired module by module, built autonomous control for it in mujoco, and am now bringing that control onto the physical robot — adding contact sensing at the tip so it can feel its way through confined spaces."
  ],
  steps: [
    ["hardware", "screw-assembled modules, single-piece middle sections and thicker pla disks replace a glued, hand-built arm. three arduino-driven motors pull the cables."],
    ["simulation dataset", "the arm is modelled in mujoco. 10,000 random cable-tension commands are applied and the arm is allowed to settle, recording tip position, backbone shape and full joint state for each."],
    ["inverse control", "to reach a point, the controller looks up the nearest settled samples (k-nn) and blends their commands. waypoints + smoothing turn this into path and curve following."],
    ["sim to real + touch", "trajectories drawn in simulation become cable-length commands for the real motors. 8 binary contact pads at the tip feed a reinforcement-learning policy for tunnel navigation and reactive human contact."],
  ],
  results: [
    ["k-nn inverse model, held-out test error", "4.2 mm", "vs 43 mm for a single-arc constant-curvature model (~90% lower)"],
    ["point reaching with gauss-newton refinement", "5.6 mm mean", "vs 10.4 mm with k-nn alone"],
    ["2d path following", "5.7 mm mean", "p90 11 mm"],
    ["2d curve following", "16 mm mean", "user-drawn curves"],
    ["3d curve following", "24 mm mean", "user-drawn curves"],
  ],
  contributions: [
    "redesigned and fabricated the arm for modularity and durability: screw-based modules, single-piece middle modules and reinforced pla disks that survive higher cable tension",
    "tuned the motors and validated repeatable bending on hardware before building autonomous control",
    "generated the 10k-sample mujoco workspace dataset linking cable tensions to tip position and arm shape",
    "built k-nn inverse control for point and object reaching, then extended it to 2d/3d path and curve following",
    "benchmarked six inverse-control models — polynomial fits, single- and two-section constant-curvature, and k-nn — for accuracy and speed",
    "built the sim-to-real pipeline and a gui that sends simulated trajectories to the robot as cable-length commands",
    "designing conductive-pla tip contact sensing and an rl policy for blind tunnel navigation and touch-reactive behaviour (in progress)",
  ],
  next: "in progress: tip sensors on hardware, motion capture for ground truth, and training the tactile policy across randomized tunnel geometries for a robosoft submission.",
  credit: "the base origami arm model builds on earlier work in the lab. the demo above is the live mujoco model compiled to webassembly: real physics at 4 ms steps, rope commands from k-nn over a dataset of settled samples plus a local-jacobian closed-loop correction, and tip contacts read from mujoco every frame.",
  repo: "https://github.com/yaqili05/softarm_sim",
};

const ABOUT = {
  bio:[
    "yaqi li is an undergraduate at mit majoring in computation and cognition (6-9) with a minor in design. her work sits at the intersection of artificial intelligence, design and human-robot interaction, with a focus on intelligent systems that fit into human environments.",
    "she is a research intern in the multisensory intelligence group (mit media lab / csail), working on multimodal machine learning, tactile sensing and sim-to-real learning for soft robotics — including a modular soft arm that learns to navigate by touch, and the opentouch dataset of synchronized video, touch and pose.",
    "before that she built ai-driven generative pipelines and eye-tracking installations with the critical matter group at the mit media lab, designed hydrogel neural interfaces in the liu lab at the national university of singapore, and, in summer 2026, shipped a production llm agent for maritime voyage data at signal ocean in london.",
    "outside the lab she serves on the mit morningside academy for design (mad) design student council, is a program lead for mit hacking medicine and an associate advisor for designplus, performs with the mit chamber music society, and plays with club golf."
  ],
};

// put your resume pdf in the folder and keep this name (or change it)
const RESUME_PDF = "resume.pdf";

/* ================================================================= */

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tone = i => 't' + (i % 4 + 1);
const media = (src, ratio, label, i=0) => src
  ? `<img src="${esc(src)}" alt="${esc(label)}" loading="lazy" style="width:100%;aspect-ratio:${ratio};object-fit:cover">`
  : `<div class="ph ${tone(i)}" style="aspect-ratio:${ratio}" data-label="${esc(label)}"></div>`;

const views = {
  projects(){
    return `
      <div class="hello">
        <img class="avatar" src="${esc(SITE.portrait)}" alt="portrait of yaqi li">
        <p class="intro">${esc(SITE.intro)} <a class="u" href="#/about">more about me</a></p>
      </div>
      <div class="bricks">${PROJECTS.map((p,i) => `
        <a class="brick" href="#/projects/${p.slug}" style="animation-delay:${i*40}ms">
          ${media(p.img, p.ratio, 'image', i)}
          <span class="label"><span class="cat">${esc(p.cat)}</span><span class="name">${esc(p.title)}</span></span>
        </a>`).join('')}</div>`;
  },
  project(slug){
    const i = PROJECTS.findIndex(p => p.slug === slug);
    if (i < 0) return views.notfound();
    if (slug === 'soft-arm') return views.softarm(i);
    const p = PROJECTS[i], prev = PROJECTS[(i-1+PROJECTS.length)%PROJECTS.length], next = PROJECTS[(i+1)%PROJECTS.length];
    return `<article class="project">
      <h1 class="page">${esc(p.title)}</h1>
      <div class="meta"><span>${esc(p.cat)}</span><span>${p.year}</span><span>${esc(p.location)}</span></div>
      ${media(p.img, 16/9, 'hero image', i)}
      <div class="body">${p.text.map(t=>`<p>${esc(t)}</p>`).join('')}
        <p style="font-size:14px;color:var(--muted);margin-top:1.6em">with ${esc(p.collaborators)}</p></div>
      <div class="gallery">${p.gallery.map((g,k)=>`<div class="${g.wide?'wide':''}">${media(g.img, g.wide?16/9:1, 'image '+String(k+1).padStart(2,'0'), i+k+1)}</div>`).join('')}</div>
      <div class="pager"><a href="#/projects/${prev.slug}">← ${esc(prev.title)}</a><a href="#/projects">all projects</a><a href="#/projects/${next.slug}">${esc(next.title)} →</a></div>
    </article>`;
  },
  softarm(i){
    const A = SOFT_ARM, prev = PROJECTS[(i-1+PROJECTS.length)%PROJECTS.length], next = PROJECTS[(i+1)%PROJECTS.length];
    return `<article class="case">
      <h1 class="page">soft arm</h1>
      <p class="lead">${esc(A.tagline)}</p>
      <div class="meta">${A.meta.map(m=>`<span>${esc(m)}</span>`).join('')}</div>

      <div class="simwrap" id="simwrap">
        <img src="images/soft-arm.jpg" alt="the soft arm touching a cylinder in simulation">
        <button class="launch" id="launch"><span>launch interactive simulation</span><small>live mujoco physics in your browser · ~11 mb</small></button>
      </div>
      <div class="simlinks"><span>reach · path following · react · ropes — drag the cylinder into the arm, orbit to look around</span><a href="sim/index.html" target="_blank" rel="noopener">open full screen ↗</a></div>

      <section class="two"><h2>overview</h2><div>${A.overview.map(t=>`<p>${esc(t)}</p>`).join('')}</div></section>

      <blockquote>${esc(A.question)}</blockquote>

      <section><h2>how it works</h2>
        <ol class="steps">${A.steps.map(([h,t],k)=>`<li><span class="n">0${k+1}</span><h3>${esc(h)}</h3><p>${esc(t)}</p></li>`).join('')}</ol></section>

      <section><h2>results in simulation</h2>
        <div class="results">${A.results.map(([a,b,c])=>`<div class="row"><span>${esc(a)}</span><strong>${esc(b)}</strong><em>${esc(c)}</em></div>`).join('')}</div></section>

      <section class="two"><h2>my contributions</h2><ul class="contrib">${A.contributions.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>

      <section class="two"><h2>next</h2><div><p>${esc(A.next)}</p><p class="fine">${esc(A.credit)}</p>
        <p style="margin-top:18px"><a class="u" href="${esc(A.repo)}" target="_blank" rel="noopener">simulation code on github ↗</a></p></div></section>

      <div class="pager"><a href="#/projects/${prev.slug}">← ${esc(prev.title)}</a><a href="#/projects">all projects</a><a href="#/projects/${next.slug}">${esc(next.title)} →</a></div>
    </article>`;
  },
  about(){
    return `<div class="about" style="margin-top:30px">
      <div><img class="avatar big" src="${esc(SITE.portrait)}" alt="portrait of yaqi li"></div>
      <div class="bio">${ABOUT.bio.map(t=>`<p>${esc(t)}</p>`).join('')}</div>
    </div>`;
  },
  resume(){
    return `<div class="resume">
      <object data="${esc(RESUME_PDF)}" type="application/pdf">
        <div class="ph t2" style="aspect-ratio:8.5/11" data-label="resume.pdf"></div>
      </object>
      <p><a href="${esc(RESUME_PDF)}" download>download pdf</a></p>
    </div>`;
  },
  contact(){
    return `<div class="contact" style="margin-top:30px">
      <p>for research, collaborations, or just to say hi.</p>
      <a class="big" href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a>
      <dl><dt>github</dt><dd><a href="https://github.com/yaqili05" target="_blank" rel="noopener">yaqili05</a></dd>
      <dt>linkedin</dt><dd><a href="${esc(SITE.linkedin)}" target="_blank" rel="noopener">/in/yaqi-li-mit</a></dd></dl></div>`;
  },
  notfound(){ return `<p style="margin-top:40px">not found · <a href="#/">back to projects</a></p>`; }
};

function render(){
  const parts = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  const route = parts[0] || 'projects';
  let html;
  if (route === 'projects' && parts[1]) html = views.project(parts[1]);
  else html = (views[route] || views.notfound)();
  app.innerHTML = html;
  const L = document.getElementById('launch');
  if (L) L.onclick = () => { const w = document.getElementById('simwrap');
    w.innerHTML = '<iframe src="sim/index.html" title="soft arm simulation" allow="fullscreen" loading="eager"></iframe>'; w.classList.add('live'); };
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.r === route));
  document.title = route === 'projects' && !parts[1] ? 'yaqi li' : `${parts[1] ? parts[1].replace(/-/g,' ') : route} — yaqi li`;
}
addEventListener('hashchange', () => { render(); scrollTo(0,0); });
render();

document.getElementById('yr').textContent = new Date().getFullYear();
const up = document.getElementById('up');
addEventListener('scroll', () => up.classList.toggle('show', scrollY > 600), {passive:true});
up.onclick = () => scrollTo({top:0, behavior:'smooth'});
</script>
</body>
</html>
