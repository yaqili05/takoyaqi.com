<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yaqi li</title>
<meta name="description" content="yaqi li — design + research. placeholder description.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' text-anchor='middle' fill='%23777'%3Ey%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   takoyaqi.com — structure after selfassemblylab.mit.edu,
   look after paulpettigrewarchitect.com (arial, lowercase, grey,
   centered, lots of white, image-led grid with hover labels)
   --------------------------------------------------------------- */
:root{
  --bg:#ffffff;
  --ink:#333333;      /* nav + strong text */
  --text:#777777;     /* body text */
  --title:#6c6c6c;    /* site title */
  --muted:#aaaaaa;
  --line:#e6e6e6;
  --tile-a:#ececec; --tile-b:#e2e2e2; --tile-c:#d9d9d9; --tile-d:#f2f2f2;
  --overlay:rgba(255,255,255,.88);
  --font: Arial, "Helvetica Neue", Helvetica, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:none}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--font);text-transform:lowercase;text-align:center;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;transition:color .2s}
a:hover{color:var(--ink)}
img{display:block;max-width:100%}

/* header */
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);padding:34px 16px 14px}
.site-title{display:inline-block;color:var(--title);font-size:40px;font-weight:normal;letter-spacing:1px;line-height:1.1}
.site-sub{display:block;font-size:15px;color:var(--muted);margin-top:4px;letter-spacing:1px}
nav ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 26px;margin-top:20px}
nav a{display:block;color:var(--ink);padding:6px 0;letter-spacing:1px;border-bottom:1px solid transparent}
nav a:hover{color:#878787}
nav a.active{color:var(--muted)}

main{max-width:1320px;margin:0 auto;padding:10px 24px 80px;min-height:60vh}
.intro{max-width:620px;margin:18px auto 38px;font-size:16px}
.hello{display:flex;flex-direction:column;align-items:center;gap:0;margin:14px auto 0}
.hello .intro{margin-top:18px}
.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;display:block}
.avatar.big{width:min(280px,70vw);height:auto;aspect-ratio:1;margin:0 auto}
a.u{color:var(--ink);border-bottom:1px solid var(--line)}
h1.page{font-size:30px;font-weight:normal;color:var(--title);letter-spacing:1px;margin:30px 0 30px}
h2{font-size:22px;font-weight:normal;color:var(--title);letter-spacing:1px;margin:0 0 14px}
h3{font-size:16px;font-weight:normal;color:var(--ink);letter-spacing:1px}
p + p{margin-top:1em}

/* case study (soft arm) */
.case{max-width:1100px;margin:0 auto}
.case .lead{max-width:640px;margin:-10px auto 16px;font-size:18px;color:var(--ink);line-height:1.5}
.case .meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 24px;font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:30px}
.simwrap{position:relative;width:100%;height:50vh;min-height:320px;background:#f0eee9;overflow:hidden}
.simwrap img{width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
.simwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.launch{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;display:flex;flex-direction:column;gap:4px;align-items:center;background:rgba(255,255,255,.92);border:1px solid var(--line);padding:18px 28px;font:inherit;text-transform:inherit;letter-spacing:1px;color:var(--ink);cursor:pointer;transition:background .2s}
.launch:hover{background:#fff}
.launch small{color:var(--muted);font-size:12px}
.simlinks{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--muted);letter-spacing:.5px;margin:10px 0 0}
.simlinks a,.u{color:var(--ink);border-bottom:1px solid var(--line)}
.case section{margin:70px 0 0;text-align:left}
.case section > h2{font-size:14px;color:var(--muted);letter-spacing:2px;margin-bottom:22px}
.case section.two{display:grid;grid-template-columns:220px 1fr;gap:20px 40px}
.case section.two > h2{margin:4px 0 0}
.case section p{font-size:16px;max-width:680px}
.case .fine{font-size:13px!important;color:var(--muted);margin-top:1.2em}
.case blockquote{margin:70px auto 0;max-width:760px;font-size:22px;line-height:1.45;color:var(--title);letter-spacing:.5px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.steps .n{display:block;font-size:13px;color:var(--muted);letter-spacing:2px;border-top:1px solid var(--ink);padding-top:12px;margin-bottom:8px}
.steps h3{margin-bottom:6px}
.steps p{font-size:14px!important}
.results .row{display:grid;grid-template-columns:1fr 140px 1fr;gap:10px 24px;padding:14px 0;border-top:1px solid var(--line);align-items:baseline}
.results strong{font-weight:normal;font-size:20px;color:var(--ink)}
.results em{font-style:normal;font-size:13px;color:var(--muted)}
.contrib{list-style:none;counter-reset:c}
.contrib li{position:relative;padding:10px 0 10px 34px;border-top:1px solid var(--line);font-size:15px;max-width:720px}
.contrib li::before{counter-increment:c;content:counter(c,decimal-leading-zero);position:absolute;left:0;top:11px;font-size:12px;color:var(--muted)}
@media (max-width:760px){
  .simwrap{height:50vh;min-height:300px}
  .case section.two{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr 1fr}
  .results .row{grid-template-columns:1fr auto}
  .results em{grid-column:1 / -1}
  .case blockquote{font-size:18px}
}
/* 3d printed chainmail */
.cm-live{position:relative;margin-top:14px;height:min(72vh,620px);min-height:420px;background:#e9eaec}
.cm-live iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
h1.page.fo-title{text-transform:none;max-width:860px;margin:30px auto 18px;line-height:1.3;font-size:28px}
.fo-authors{text-transform:none;font-size:16px;color:var(--ink);margin:0 auto 6px;max-width:760px}
.fo-authors b{font-weight:700}
.fo-cite{text-transform:none;font-size:13px;color:var(--muted);margin:0 auto 4px}
.fo-cite a{color:var(--ink)}
@media (max-width:640px){h1.page.fo-title{font-size:21px}}
.fo-fig{margin:26px 0 6px;max-width:680px}
.fo-fig img{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff}
.fo-fig figcaption{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.fo-fig figcaption b{font-weight:400;color:var(--ink)}
.fo-live{height:min(80vh,720px);background:#0d1016;margin-top:30px}
.fo-flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 18px;font-size:13px;color:var(--ink)}
.fo-flow span{border:1px solid var(--line);border-radius:3px;padding:6px 10px;line-height:1.35;text-align:center}
.fo-flow i{font-style:normal;color:var(--muted)}
.fo-steps{list-style:none;counter-reset:s;border-top:1px solid var(--line);max-width:680px}
.fo-steps li{counter-increment:s;display:grid;grid-template-columns:34px 120px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.fo-steps li::before{content:counter(s,decimal-leading-zero);color:var(--muted);font-size:12px;padding-top:2px}
.fo-steps b{font-weight:400;color:var(--ink)}
.fo-t{border-collapse:collapse;margin-top:16px;font-size:14px;width:100%;max-width:680px}
.fo-t th,.fo-t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-weight:400}
.fo-t th:first-child{text-align:left;color:var(--ink)}
.fo-t thead th{color:var(--muted);font-size:12px;letter-spacing:.5px}
.fo-credit{margin-top:60px!important;text-align:left}
.fo-cap{font-size:13px!important;color:var(--muted);margin-top:10px}
@media (max-width:640px){.fo-steps li{grid-template-columns:30px 1fr}.fo-steps li span{grid-column:2}.fo-t{font-size:12px}}
.pt-live{height:min(80vh,720px);background:#171E55;margin-top:30px}
.pt-metrics{list-style:none;margin-top:14px;max-width:680px;border-top:1px solid var(--line)}
.pt-metrics li{display:grid;grid-template-columns:150px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.pt-metrics li span{color:var(--ink)}.pt-metrics li i{font-style:normal;color:var(--muted)}.pt-metrics li b{font-weight:400;color:var(--ink)}
@media (max-width:640px){.pt-live{height:78vh}.pt-metrics li{grid-template-columns:1fr auto}.pt-metrics li i{display:none}}
.cm-intro{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center;margin-top:34px!important}
.cm-intro h2{margin-bottom:18px;font-size:14px;color:var(--muted);letter-spacing:2px}
.cm-portrait{aspect-ratio:1042/1400;max-height:640px}
@media (max-width:760px){.cm-intro{grid-template-columns:1fr;gap:24px}.cm-portrait{max-height:none}}
.cm figure{margin:0;background:#eeeeec;overflow:hidden}
.cm figure img{width:100%;height:100%;object-fit:cover;display:block}
.cm-design{margin-top:90px!important}
.cm-head{display:grid;grid-template-columns:220px 1fr;gap:6px 40px;align-items:baseline;margin-bottom:22px}
.cm-head .n{font-size:13px;color:var(--muted);letter-spacing:2px;grid-row:span 2}
.cm-head h3{font-size:20px;color:var(--title)}
.cm-head p{grid-column:2;font-size:16px;max-width:640px}
.cm-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cm-grid .wide{grid-column:1 / -1;aspect-ratio:16/8.5}
.cm-grid figure:not(.wide){aspect-ratio:4/3}
.cm-grid.three{grid-template-columns:repeat(3,1fr)}
.cm-grid.three figure{aspect-ratio:4/3}
@media (max-width:760px){
  .cm-head{grid-template-columns:1fr}
  .cm-head p{grid-column:1}
  .cm-grid,.cm-grid.three{grid-template-columns:1fr}
}
/* gaze to the stars — night palette */
.case.gz{background:#000;color:#ccc;margin:20px -24px 0;padding:0 24px 40px;max-width:none}
.gz-hero{position:relative;height:min(72vh,640px);min-height:340px;overflow:hidden;margin:0 -24px;background:#000}
.gz-hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.gz-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 20px 44px;
  background:linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(0,0,0,.85));color:#fff;text-align:center}
.gz-logo{width:74px;height:auto;margin-bottom:16px;opacity:.95}
.gz-over h1{font-weight:normal;font-size:38px;letter-spacing:6px;margin:0 0 10px;color:#fff}
.gz-over p{font-size:15px;letter-spacing:1.5px;color:#ddd;max-width:560px}
.gz-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 26px;padding:22px 0 0;font-size:12.5px;letter-spacing:1.5px;color:#888}
.case.gz{max-width:none}
.case.gz > section,.case.gz > .gz-nums,.case.gz > .pager{max-width:1040px;margin-left:auto;margin-right:auto}
.case.gz section > h2{color:#888}
.case.gz section p{color:#ccc}
.case.gz h2,.case.gz strong{color:#fff}
.gz-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:70px!important;text-align:center}
.gz-nums div{border-top:1px solid #333;padding-top:18px}
.gz-nums strong{display:block;font-weight:normal;font-size:44px;letter-spacing:2px}
.gz-nums span{font-size:13px;color:#999;letter-spacing:1px}
.gz-pod{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:40px;align-items:center}
.gz-podvid video{width:100%;display:block;background:#000}
.gz-eye{margin:30px 0 0;max-width:420px}
.gz-eye video{width:100%;display:block;border-radius:2px}
.gz-eye figcaption{font-size:12px;color:#777;margin-top:8px;letter-spacing:1px}
.gz-yt{position:relative;aspect-ratio:16/9;background:#111}
.gz-yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gz-links{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.gz-links a{color:#fff;border-bottom:1px solid #444;font-size:15px;letter-spacing:.5px}
.gz-links a:hover{border-bottom-color:#fff}
.case.gz .fine{color:#777!important;margin-top:22px}
.case.gz .pager{border-top-color:#222}
.case.gz .pager a{color:#bbb}
@media (max-width:760px){
  .case.gz{margin:14px -16px 0;padding:0 16px 30px}
  .gz-hero{margin:0 -16px;height:60vh}
  .gz-over h1{font-size:26px;letter-spacing:4px}
  .gz-nums{grid-template-columns:1fr}
  .gz-pod{grid-template-columns:1fr}
}
/* voyages agent — signal ocean palette */
.case.so{--so-navy:#003357;--so-ink:#2B3340;--so-blue:#264292;--so-sky:#7FB3F0;--so-mist:#F3F5F8;--so-ice:#E9EFF7;--so-grey:#85858A;
  font-family:Montserrat, Arial, Helvetica, sans-serif;color:var(--so-ink)}
.case.so .so-hero{position:relative;display:grid;grid-template-columns:1.25fr 1fr;align-items:center;gap:20px;background:var(--so-navy);color:#fff;text-align:left;
  padding:56px 56px;margin:26px 0 0;overflow:hidden}
.so-hero::after{content:"";position:absolute;right:-120px;bottom:-160px;width:420px;height:420px;border:1px solid rgba(127,179,240,.25);transform:rotate(45deg)}
.so-logo img{width:170px;height:auto;display:block;margin-bottom:34px}
.so-hero h1{font-weight:500;font-size:40px;letter-spacing:.5px;line-height:1.1;margin:0 0 16px;color:#fff}
.so-hero p{font-size:17px;line-height:1.55;color:#dfe8f5;max-width:520px}
.so-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px;font-size:12.5px;letter-spacing:1px;color:var(--so-sky)}
.so-meta a{color:#fff;border-bottom:1px solid rgba(255,255,255,.4)}
.so-diamond{width:100%;max-width:360px;justify-self:center;position:relative;z-index:1;filter:drop-shadow(0 10px 30px rgba(0,0,0,.25))}
.case.so .diagram{background:var(--so-mist);margin-top:0}
.case.so .diagram svg{display:block;width:100%;height:auto}
.case.so section > h2{color:var(--so-blue);font-weight:600;font-size:12.5px;letter-spacing:2.5px}
.case.so h3{color:var(--so-navy);font-weight:600}
.case.so section p,.case.so .contrib li,.case.so .results span{color:var(--so-ink)}
.case.so .results em,.case.so .fine{color:var(--so-grey)!important}
.case.so .results strong,.case.so .compare strong{color:var(--so-navy);font-weight:600}
.case.so .results .row,.case.so .contrib li{border-top-color:var(--so-ice)}
.case.so .contrib li::before{color:var(--so-blue);font-weight:600}
.case.so .steps .n{border-top:2px solid var(--so-navy);color:var(--so-blue);font-weight:600}
.case.so .compare > div{background:var(--so-mist);border-top:3px solid var(--so-navy);padding:20px 22px}
.case.so .compare > div:last-child{background:var(--so-navy);border-top-color:var(--so-sky)}
.case.so .compare > div:last-child h3,.case.so .compare > div:last-child strong{color:#fff}
.case.so .compare > div:last-child p{color:#dfe8f5!important}
.case.so blockquote{background:var(--so-ice);color:var(--so-navy);font-size:19px;padding:34px 40px;max-width:none;text-align:left;border-left:4px solid var(--so-blue)}
.so-btn{display:inline-block;background:var(--so-navy);color:#fff!important;padding:10px 18px;letter-spacing:1px;font-size:13px}
.so-btn:hover{background:var(--so-blue)}
.case.so .pager a{color:var(--so-navy)}
@media (max-width:760px){
  .case.so .so-hero{grid-template-columns:1fr;padding:34px 24px}
  .so-diamond{max-width:220px}
  .so-hero h1{font-size:30px}
  .case.so blockquote{padding:24px}
}
/* voyages agent */
.diagram{margin:0;background:#f3f1ec}
.diagram img{width:100%;height:auto}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.compare > div{border-top:1px solid var(--ink);padding-top:14px}
.compare h3{margin-bottom:8px}
.compare p{font-size:15px!important}
.compare strong{display:block;margin-top:12px;font-weight:normal;font-size:22px;color:var(--ink)}
.steps.five{grid-template-columns:repeat(5,1fr)}
.results.stack{margin-top:34px}
.results.stack .row{grid-template-columns:160px 1fr}
@media (max-width:760px){
  .compare{grid-template-columns:1fr}
  .steps.five{grid-template-columns:1fr 1fr}
  .results.stack .row{grid-template-columns:1fr}
}
/* resume */
.resume{max-width:820px;margin:30px auto 0}
.resume object{display:block;width:100%;height:80vh;min-height:520px;border:1px solid var(--line)}
.resume p{margin-top:16px;font-size:14px;letter-spacing:1px}
.resume a{color:var(--ink);border-bottom:1px solid var(--line)}

/* placeholder imagery */
.ph{position:relative;width:100%;background:var(--tile-a);display:flex;align-items:center;justify-content:center;color:#b5b5b5;font-size:12px;letter-spacing:2px}
.ph.t1{background:var(--tile-a)} .ph.t2{background:var(--tile-b)} .ph.t3{background:var(--tile-c)} .ph.t4{background:var(--tile-d)}
.ph::after{content:attr(data-label)}

/* work grid — masonry "bricks" */
.bricks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1200px;margin:0 auto}
@media (max-width:560px){.bricks{grid-template-columns:1fr}}
.brick{margin:0;display:block;position:relative;overflow:hidden;animation:fade .5s ease both}
.brick .ph{transition:transform .6s ease}
.brick:hover .ph,.brick:hover video,.brick:hover img{transform:scale(1.03)}
.brick video,.brick img{transition:transform .6s ease}
.brick .label{position:absolute;inset:0;background:var(--overlay);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .35s}
.brick:hover .label,.brick:focus-visible .label{opacity:1}
.label .cat{font-size:13px;color:var(--muted);letter-spacing:1px}
.label .name{font-size:19px;color:var(--ink);letter-spacing:1px;line-height:1.3;margin-top:2px}
@media (hover:none){ .brick .label{position:static;opacity:1;background:none;padding:8px 0 4px} }
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* project page */
.project{max-width:980px;margin:0 auto}
.project .meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 28px;font-size:14px;color:var(--muted);letter-spacing:1px;margin:-14px 0 30px}
.project .body{max-width:640px;margin:36px auto;font-size:16px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.gallery .wide{grid-column:1 / -1}
.pager{display:flex;justify-content:space-between;gap:16px;margin:50px 0 0;font-size:14px;letter-spacing:1px;border-top:1px solid var(--line);padding-top:18px}

/* research */
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px 28px;text-align:center}
.theme h3{margin:16px 0 8px}
.theme p{max-width:380px;margin:0 auto}

/* lists: publications / press */
.list{max-width:760px;margin:0 auto;text-align:left}
.year{font-size:14px;color:var(--muted);letter-spacing:2px;margin:36px 0 8px;text-align:center}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 20px;padding:16px 0;border-top:1px solid var(--line)}
.item .t{color:var(--ink)}
.item .s{font-size:14px}
.item .r{font-size:13px;color:var(--muted);white-space:nowrap;align-self:start;padding-top:2px}
.item a.t:hover{color:#878787}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:48px;max-width:1040px;margin:0 auto;text-align:left;align-items:start}
.about .bio{font-size:16px}
.cv{margin-top:34px}
.cv h3{margin:28px 0 8px;color:var(--title)}
.cv li{list-style:none;display:grid;grid-template-columns:90px 1fr;gap:12px;padding:5px 0;font-size:14px}
.cv li span:first-child{color:var(--muted)}

/* collaborators */
.names{columns:3 200px;column-gap:28px;max-width:900px;margin:0 auto;font-size:15px}
.names li{list-style:none;padding:4px 0;break-inside:avoid}
.names h3{margin:0 0 10px;column-span:all}

/* contact */
.contact{max-width:880px;margin:30px auto 0;display:grid;grid-template-columns:260px 1fr;gap:56px;align-items:center;text-align:left}
.contact .who{text-align:center}
.contact .who img{width:180px;height:180px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 18px}
.contact .who .nm{font-size:18px;color:var(--ink);letter-spacing:1px}
.contact .who .meta{font-size:13px;color:var(--muted);letter-spacing:.5px;margin-top:6px;line-height:1.6}
.contact .who .status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--text);border:1px solid var(--line);border-radius:20px;padding:5px 12px}
.contact .who .status i{width:7px;height:7px;border-radius:50%;background:#5fb67a}
.contact .lede{font-size:22px;line-height:1.45;color:var(--ink);margin-bottom:10px}
.contact .sub{font-size:15px;color:var(--text);margin-bottom:28px}
.contact .mail{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:34px}
.contact .mail a{font-size:24px;color:var(--ink);letter-spacing:.5px;border-bottom:1px solid var(--line);padding-bottom:3px}
.contact .mail a:hover{border-color:var(--ink)}
.contact .mail button{font:inherit;font-size:12px;letter-spacing:1px;color:var(--text);background:none;border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer}
.contact .mail button:hover{border-color:var(--ink);color:var(--ink)}
.contact .links{list-style:none;border-top:1px solid var(--line)}
.contact .links a{display:grid;grid-template-columns:110px 1fr auto;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);color:var(--ink);transition:padding .25s ease,background .25s ease}
.contact .links a:hover{padding-left:14px;background:#fafafa}
.contact .links .k{font-size:12px;letter-spacing:1.5px;color:var(--muted)}
.contact .links .v{font-size:16px}
.contact .links .ar{color:var(--muted);transition:transform .25s ease}
.contact .links a:hover .ar{transform:translate(3px,-3px);color:var(--ink)}
@media (max-width:760px){.contact{grid-template-columns:1fr;gap:34px}.contact .lede{font-size:19px}.contact .mail a{font-size:19px}.contact .links a{grid-template-columns:90px 1fr auto}}

footer{padding:40px 16px 50px;font-size:13px;color:var(--muted);letter-spacing:1px}
footer .social{display:flex;justify-content:center;gap:22px;margin-bottom:10px}
.up{position:fixed;right:18px;bottom:18px;width:38px;height:38px;border-radius:50%;background:#999;color:#fff;border:0;font:18px var(--font);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
.up.show{opacity:.7;pointer-events:auto}
.up:hover{opacity:1}

@media (max-width:760px){
  header{padding:24px 16px 10px;position:static}
  .site-title{font-size:30px}
  nav ul{gap:0 16px;margin-top:14px}
  main{padding:10px 16px 60px}
  .about{grid-template-columns:1fr;gap:28px}
  .gallery{grid-template-columns:1fr}
  .item{grid-template-columns:1fr}
  .item .r{padding-top:0}
}

const SOFT_ARM = {

  steps: [
    ["hardware", "screw-assembled modules, single-piece middle sections and thicker pla disks replace a glued, hand-built arm. three arduino-driven motors pull the cables."],

    ["inverse control", "to reach a point, the controller looks up the nearest settled samples (k-nn) and blends their commands. waypoints + smoothing turn this into path and curve following."],
    ["sim to real + touch", "trajectories drawn in simulation become cable-length commands for the real motors. 8 binary contact pads at the tip feed a reinforcement-learning policy for tunnel navigation and reactive human contact."],
  ],
  results: [
    ["k-nn inverse model, held-out test error", "4.2 mm", "vs 43 mm for a single-arc constant-curvature model (~90% lower)"],

    ["2d path following", "5.7 mm mean", "p90 11 mm"],
    ["2d curve following", "16 mm mean", "user-drawn curves"],
    ["3d curve following", "24 mm mean", "user-drawn curves"],
  ],
  contributions: [
    "redesigned and fabricated the arm for modularity and durability: screw-based modules, single-piece middle modules and reinforced pla disks that survive higher cable tension",
    "tuned the motors and validated repeatable bending on hardware before building autonomous control",
    "generated the 10k-sample mujoco workspace dataset linking cable tensions to tip position and arm shape",
    "built k-nn inverse control for point and object reaching, then extended it to 2d/3d path and curve following",

const VOYAGES = {

    "the inputs are noisy: crew-typed destinations, ais gaps while a ship is in port, terminals with no geofence, ship-to-ship transfers, manual entries upstream. some errors reach clients, who file curation tickets. an analyst spends ~15 minutes per case, and about 80% of that is gathering evidence across five or six tools rather than deciding.",
  ],
  compare: [
    ["today", "read the ticket and work out the vessel and voyage, open the voyage panel, the ais track and draughts, check sts events, lineups, fixtures and history, then decide.", "~15 min per case"],
    ["with the agent", "paste the ticket and press run. each case comes back with the vessel and voyage identified, all evidence gathered and checked, a verdict with its reasoning, and the exact fix as rows ready to execute.", "30–90 s per case"],
  ],
  steps: [
    ["resolve", "parse the free-text ticket into one or more vessel + voyage cases."],
    ["evidence", "10 evidence sources fetched in parallel as tools: voyage snapshots, ais track and draught, port geofences, sts events, lineups, fixtures, vessel call history."],
    ["checks", "8 deterministic checks per port stop (draught change, stay length vs the vessel's history, geofence coverage…) turn raw data into findings."],
    ["verdict", "a stronger model reads only the findings, ~40 rules taught by curators, and few-shot examples retrieved from the case bank — never the raw data."],
    ["answer", "verdict, evidence and the exact database actions, shown in an approval ui. the curator decides; the agent never writes to the database."],
  ],
  stack: [
    ["models", "gemini flash for the pipeline stages, a larger gemini model for the verdict; configurable so models can be swapped"],
    ["data", "voyage snapshots, data warehouse, voyages and ais apis, jira"],
    ["evaluation", "llm-as-judge against a frozen benchmark of 60 real tickets; tf-idf few-shot retrieval from the case bank"],
    ["interface", "live in the internal curation tool, with accept / reject feeding the case bank"],
  ],
  example: "a client wrote that a tanker's voyage showed a part discharge at an african port, but it had only stopped to bunker on the way to new york. in 36 s the agent resolved the vessel and voyage from the text alone, found a flat draught over the 8-hour stay, an 8 h call against this vessel's typical 52 h discharge across 27 past calls, and a lineup and fixtures confirming the us destination — and proposed a single fix: re-label that stop from discharge to bunkers. it also noted the new york discharge couldn't be recorded yet because ais coverage hadn't reached it.",
  results: [
    ["accuracy on 30 unseen historical tickets", "~90%", "after teaching rules on 30 others"],
    ["accepted by curators on real tickets", "76%", "41 of 54; every rejection comes with a reason"],
    ["investigation time per case", "30–90 s", "vs ~15 min by hand"],
    ["analyst time recoverable", "~215 h / yr", "indicative, at ~80 cases a month"],

  loop: [

    "reject: a short form asks why and what was expected, prefilled with the agent's proposal.",

    "the change must fix the rejected cases, keep every accepted one and pass all 60 benchmark tickets; a person approves it before it ships. two curator rejections in one week became two rule fixes.",
  ],
  contributions: [

    "presented the system to the company all-hands",
  ],
  next: "next: take a jira link in and comment the analysis on every new ticket automatically, move from proposing to acting once accept rates earn trust, run the learning loop on a schedule, and extend to cargo tracking and forecasting.",
  credit: "built with the data science team and the curators in london and athens during an mit misti internship. client, vessel and system details are simplified here.",

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const views = {

    return `<article class="case">

  fontan(i){
    const prev = PROJECTS[(i-1+PROJECTS.length)%PROJECTS.length], next = PROJECTS[(i+1)%PROJECTS.length];
    const PAPER = "https://onlinelibrary.wiley.com/doi/10.1002/cnm.70128", PMC = "https://pmc.ncbi.nlm.nih.gov/articles/PMC12791198/";
    const T = [["portal vein, mean","9.7","10.0","10.1","10.1"],["portal vein, systolic","12.7","12.6","12.7","12.9"],["hepatic artery, mean","88.2","88.2","88.9","88.8"],["hepatic artery, systolic","95.1","95.3","99.5","99.8"]];
const fig=(n,f,cap)=>`<figure class="fo-fig"><a href="images/${f}" target="_blank" rel="noopener"><img src="images/${f}" alt="figure ${n}: ${cap.replace(/"/g,'')}" loading="lazy"></a><figcaption><b>figure ${n}.</b> ${cap}</figcaption></figure>`;
    return `<article class="case fo">
      <h1 class="page fo-title">A One‐Dimensional (1D) Computational Fluid Dynamics Study of Fontan‐Associated Liver Disease (FALD)</h1>
      <p class="fo-authors"><b>Yaqi Li</b>, Justin D. Weigand, Charles Puelz, Mette S. Olufsen, Alyssa Taylor‐Lapole</p>
      <p class="fo-cite"><i>International Journal for Numerical Methods in Biomedical Engineering</i>, 2026 · <a class="u" href="${PAPER}" target="_blank" rel="noopener">doi:10.1002/cnm.70128</a></p>
      <div class="cm-live fo-live"><iframe src="sim/aorta/index.html" title="patient-specific aortic flow" loading="lazy" allow="fullscreen"></iframe></div>
      <div class="simlinks"><span>patient-specific aortas from 3d slicer · pick a patient, change cardiac output, click a vessel to probe flow and wall shear</span><a href="sim/aorta/index.html" target="_blank" rel="noopener">open full screen ↗</a></div>

      <section class="two"><h2>overview</h2><div>
        <p>children born with a single working ventricle — hypoplastic left heart syndrome (hlhs) or double outlet right ventricle (dorv) — are palliated with the fontan procedure. venous blood then reaches the lungs passively, without a pump, and the raised venous pressure backs up into the liver. over time this can scar the liver: fontan-associated liver disease. it is especially common in hlhs patients.</p>
        <p>we built patient-specific 1d fluid dynamics models of the liver's two blood supplies, the hepatic artery and the portal vein. using them, we compared an hlhs patient with an age-matched dorv patient, and simulated early and late stages of fald.</p></div></section>

      <section class="two"><h2>the circuit</h2><div>
        <div class="fo-flow">${["right heart","aorta","hepatic artery · 30%<br>portal vein · 70%","liver","systemic veins","lungs (passive)"].map(x=>`<span>${x}</span>`).join('<i>→</i>')}<i>↺</i></div>
        <p>in a fontan circulation, the single ventricle pumps blood into the aorta. the liver is fed by the portal vein (about 70% of its blood) and the hepatic artery (about 30%). blood then drains into the systemic veins and passes through the lungs without a pump before returning to the heart.</p>
        ${fig(2,'fontan-fig2.jpg','(a) the fontan circulation, including flow to the liver. (b) 3d rendering of the hepatic artery (green) and portal vein (red) vasculature extracted from ct. (c) inflow waveforms to the hepatic artery and portal vein for the two patients.')}</div></section>

      <section class="two"><h2>method</h2><div>
        <ol class="fo-steps">
          <li><b>segment</b><span>vessel geometry segmented from imaging in 3d slicer</span></li>
          <li><b>centerlines</b><span>vmtk centerlines from maximum inscribed spheres, with junctions corrected, give each vessel's length and radius</span></li>
          <li><b>network</b><span>networks scaled allometrically to each patient's height and weight</span></li>
          <li><b>solve</b><span>1d mass and momentum conservation with a linear elastic wall, flow waveforms at the inlets and structured-tree outflow conditions</span></li>
          <li><b>fald</b><span>disease progression modelled by stiffening the portal vein (k₃ from 3.0 to 3.6 to 4.2 × 10⁵ g/cm/s²) and raising outlet resistance</span></li>
        </ol>
        ${fig(4,'fontan-fig4.jpg','simulation workflow: progressive fald (left) and controls for the effects of inflow and patient geometry (right).')}</div></section>

      <section class="two"><h2>findings</h2><div>
        <p>the hlhs patient has higher hepatic arterial pressure than the dorv patient, and the gap widens as fald progresses. perfusion maps show rising pressure and falling flow in the liver tissue fed by the portal vein: the regions most at risk of fibrosis.</p>
        <table class="fo-t"><thead><tr><th>pressure (mmHg)</th><th>dorv</th><th>hlhs</th><th>early fald</th><th>late fald</th></tr></thead>
        <tbody>${T.map(r=>`<tr>${r.map((c,k)=>k?`<td>${c}</td>`:`<th>${c}</th>`).join('')}</tr>`).join('')}</tbody></table>
        <p class="fo-cap">hepatic artery wall shear, main branch: 9.61 pa (hlhs) vs 6.50 pa (dorv).</p></div></section>

      <p class="fo-cap fo-credit">figures from li et al. (2026), <i>int. j. numer. method. biomed. eng.</i>, open access under cc by-nc 4.0 · <a class="u" href="${PAPER}" target="_blank" rel="noopener">read the paper ↗</a> &nbsp; <a class="u" href="${PMC}" target="_blank" rel="noopener">pmc ↗</a></p>

      <div class="pager"><a href="#/projects/${prev.slug}">← ${esc(prev.title)}</a><a href="#/projects">all projects</a><a href="#/projects/${next.slug}">${esc(next.title)} →</a></div>
    </article>`;
  },
  peel(i){

    return `<article class="case pt">

      <div class="meta"><span>physics simulation · game</span><span>2026</span><span>three.js · webgl</span></div>

      <section class="two"><h2>overview</h2><div>
        <p>a small browser game about a very specific shape: the four-flap banana peel you see in cartoons. you grab the peel by its stalk, swing it and let go. it tumbles, bounces and settles, then gets scored against the ideal.</p>
        <p>the peel is a soft body, not an animation. like a real peel, only the thin neck holds the four long curved flaps together, so every throw lands differently.</p></div></section>
      <section class="two"><h2>how it works</h2><div>
        <p>the peel is a set of verlet particles tied together by distance constraints: a rigid core at the neck, and flaps built from rows of three particles with cross-bracing and bending links so they curl but don't stretch. gravity, floor contact and friction are stepped at a fixed rate, and the mesh, skin and inner-pith textures are generated in code and rendered with three.js.</p>
        <p>once the peel stops moving, it's compared with the perfect peel on five weighted measures, which add up to a score out of 100 and a grade from s to d:</p>
        <ul class="pt-metrics">${M.map(([a,b,w])=>`<li><span>${a}</span><i>${b}</i><b>${w}</b></li>`).join('')}</ul></div></section>
      <div class="pager"><a href="#/projects/${prev.slug}">← ${esc(prev.title)}</a><a href="#/projects">all projects</a><a href="#/projects/${next.slug}">${esc(next.title)} →</a></div>

function render(){
  const parts = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  const route = parts[0] || 'projects';
  let html;
  if (route === 'projects' && parts[1]) html = views.project(parts[1]);
  else html = (views[route] || views.notfound)();
  app.innerHTML = html;
  const D = document.getElementById('so-diagram');
  if (D) fetch('images/voyages-agent.svg').then(r => r.text()).then(t => { if (D.isConnected) D.innerHTML = t; }).catch(() => {});
  const CM = document.getElementById('copymail');
  if (CM) CM.onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(SITE.email) : Promise.reject()).then(() => { CM.textContent = 'copied ✓'; setTimeout(() => CM.textContent = 'copy', 1600); }).catch(() => { location.href = 'mailto:' + SITE.email; }); };
  const L = document.getElementById('launch');
  if (L) L.onclick = () => { const w = document.getElementById('simwrap');
    w.innerHTML = '<iframe src="sim/index.html" title="soft arm simulation" allow="fullscreen" loading="eager"></iframe>'; w.classList.add('live'); };
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.r === route));
  document.title = route === 'projects' && !parts[1] ? 'yaqi li' : `${parts[1] ? parts[1].replace(/-/g,' ') : route} — yaqi li`;
}
addEventListener('hashchange', () => { render(); scrollTo(0,0); });
